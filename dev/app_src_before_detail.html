<title>WiFi-Check</title>
<meta name="application-name" content="WiFi-Check">
<meta name="apple-mobile-web-app-title" content="WiFi-Check">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7AC143">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: sticky top bar (brand, theme, bell, user). Desktop: pill tabs under it. Phone: fixed bottom tab bar, confirm dialogs become bottom sheets. */
  --bg:#F3F8EE; --surface:#FFFFFF; --surface-2:#EBF3E4; --ink:#10281A; --muted:#58705F; --line:#D6E4CC;
  --brand:#7AC143; --brand-strong:#2E7D1A; --on-strong:#FFFFFF; --brand-soft:#E3F2D6; --on-brand:#10281A;
  --late:#7A4A00; --late-soft:#FFF0CF; --amber:#E0A100; --off:#A8322A; --off-soft:#FBE6E3; --hatch:#E8EFE2;
  --scrim:rgba(8,20,12,.55);
  --shadow:0 1px 2px rgba(16,40,26,.06),0 8px 24px rgba(16,40,26,.07);
  --font-display:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --font-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1710; --surface:#132119; --surface-2:#1A2C20; --ink:#E7F2E4; --muted:#93AB99; --line:#274030;
    --brand:#8FD65A; --brand-strong:#8FD65A; --on-strong:#0C1710; --brand-soft:#1E3624; --on-brand:#0C1710;
    --late:#F2C265; --late-soft:#3A2D10; --amber:#F2C265; --off:#F19A92; --off-soft:#3A1B18; --hatch:#182A1E;
    --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1710; --surface:#132119; --surface-2:#1A2C20; --ink:#E7F2E4; --muted:#93AB99; --line:#274030;
  --brand:#8FD65A; --brand-strong:#8FD65A; --on-strong:#0C1710; --brand-soft:#1E3624; --on-brand:#0C1710;
  --late:#F2C265; --late-soft:#3A2D10; --amber:#F2C265; --off:#F19A92; --off-soft:#3A1B18; --hatch:#182A1E;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.shell{max-width:1200px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:24px;font-weight:700} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-strong);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-display);font-size:18px;font-weight:700;display:block;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.user{display:flex;align-items:center;gap:8px;min-width:0}
.uname{line-height:1.25;min-width:0;font-size:14px}
.uname b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.uname span{color:var(--muted);font-size:13px;display:block}
.badge{position:absolute;top:-6px;right:-6px;background:var(--amber);color:#2b1c00;border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;font-weight:700;border:2px solid var(--bg)}
.bellwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(400px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:35;padding:8px}
.note{display:flex;gap:12px;padding:12px;border-radius:10px;width:100%;text-align:left;background:none;border:0;cursor:pointer;margin-bottom:4px}
.note:hover{background:var(--surface-2)}
.note.warn{background:var(--late-soft)}
.note b{font-family:var(--font-display);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand-strong);flex:none;margin-top:7px}
.dot.read{background:transparent;border:1px solid var(--line)}
.dot.amber{background:var(--amber);border:0}
.pre{white-space:pre-wrap;word-break:break-word;display:block}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--brand-strong);color:var(--on-strong);border-color:var(--brand-strong)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;margin-bottom:16px;font-size:14px}
.demo label{margin:0;display:inline}
.demo input{background:var(--surface);width:auto;min-height:36px;padding:4px 8px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.hero{box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:14px}

/* buttons, fields */
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--brand-strong);color:var(--on-strong);font-weight:600;cursor:pointer;font-family:var(--font-display);font-size:15px;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.danger{background:var(--off);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--off);font-size:14px;min-height:20px}
.ok{color:var(--brand-strong);font-size:14px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;background:var(--brand-soft);color:var(--ink);line-height:1.5}
.chip.off{background:var(--off-soft);color:var(--off)}
.chip.late{background:var(--late-soft);color:var(--late);box-shadow:inset 0 0 0 1px var(--amber)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.alert-y{background:var(--late-soft);color:var(--late);border:1px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:500;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--brand-strong);color:var(--on-strong)}

/* login */
.login-wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
.demo-acc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.acc{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer}
.acc:hover{background:var(--brand-soft)}

/* check-in */
.clock{font-family:var(--font-display);font-weight:600;font-size:clamp(40px,12vw,60px);letter-spacing:1px;line-height:1.1;text-align:center}
.ring{--p:0;width:min(250px,68vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:18px auto}
.ring button{width:calc(100% - 28px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:var(--brand-strong);color:var(--on-strong);font-family:var(--font-display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring button span{font-size:30px;font-weight:700}
.ring button small{font-size:14px;opacity:.85}
.ring button.out{background:var(--ink);color:var(--surface)}
.ring button:disabled{opacity:.4;cursor:not-allowed}
.center{text-align:center}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .when{font-weight:500}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sum div{background:var(--surface-2);border-radius:12px;padding:10px 16px}
.sum b{font-family:var(--font-display);font-size:26px;display:block;line-height:1.2}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}
thead th{background:var(--surface-2);font-family:var(--font-display);font-weight:600;font-size:14px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

/* schedule */
.wk{min-width:940px;table-layout:fixed}
.wk th,.wk td{padding:6px;text-align:center}
.wk th:first-child,.wk td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;width:116px;z-index:1;border-right:1px solid var(--line)}
.wk thead th:first-child{background:var(--surface-2)}
.wk th.today{background:var(--brand);color:var(--on-brand)}
.wk th small{display:block;font-weight:400;font-size:13px}
.cell{display:flex;flex-direction:column;gap:3px;align-items:flex-start;width:100%;min-height:64px;padding:8px;border-radius:10px;border:1px solid transparent;background:var(--brand-soft);text-align:left;font-size:14px;line-height:1.3}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--brand-strong)}
.cell .pn{font-family:var(--font-display);font-weight:500}
.cell.off{background:var(--off-soft);border-color:var(--off)}
.cell.off .pn{text-decoration:line-through;color:var(--muted)}
.cell .cov{color:var(--ink);font-weight:500}
.cell .tm{display:block;font-size:13px;line-height:1.4}
.cell .tm small{color:var(--muted);font-size:13px}
.cell.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted);align-items:center;justify-content:center}
.cell.me{box-shadow:inset 0 0 0 2px var(--brand-strong)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dchip small{color:var(--muted);font-size:12px;line-height:1.3}
.dchip b{font-family:var(--font-display);font-size:16px;line-height:1.3}
.dchip.on{background:var(--brand-strong);color:var(--on-strong);border-color:var(--brand-strong)}
.dchip.on small{color:inherit}
.dchip.off{opacity:.55}
.dchip.tod b{text-decoration:underline}
.dcard{display:flex;flex-direction:column;gap:6px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* dialog */
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;text-align:right}

@media (max-width:760px){
  .grid2,.login-wrap{grid-template-columns:minmax(0,1fr)}
  .tab svg{width:22px;height:22px}
}
@media (max-width:720px){
  .shell.in{padding-block:0 100px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:0;border-bottom:0;border-top:1px solid var(--line);background:var(--surface);overflow:visible;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tab{flex:1;flex-direction:column;gap:2px;border:0;background:none;border-radius:12px;padding:6px 2px;font-size:12px;min-width:0;white-space:normal;text-align:center;line-height:1.25}
  .tab[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
  .pop{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);width:auto}
  .overlay{place-items:end center;padding:0}
  .modal{width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .hide-s{display:none}
  h1{font-size:22px}
}
@media (max-width:480px){
  .topbar.in .brand>div{display:none}
  .uname span{display:none}
  .uname b{max-width:96px}
}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
}
/* ---- v4 additions: chart + status tokens (light), then dark below ---- */
:root{
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --st-good:#0ca30c; --st-warn:#fab219; --st-bad:#d03b3b;
  --grid:#DDE8D4; --axis:#B7CBAB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#274030; --axis:#3b5a45; }
}
:root[data-theme="dark"]{ --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#274030; --axis:#3b5a45; }

/* date field (opens calendar dialog) */
.dfield{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500;min-width:150px;width:100%}
.dfield:hover{background:var(--surface-2)}
.dfield svg{width:18px;height:18px;color:var(--muted);flex:none}
.demo .dfield{min-height:36px;padding:4px 10px;width:auto;min-width:0}
.row .dfield{width:auto}
#dpbox .overlay{z-index:50}
.dpm{width:min(360px,100%)}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dgrid.dh span{text-align:center;color:var(--muted);font-size:13px}
.dday{aspect-ratio:1;border:0;background:none;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:15px;min-height:36px}
.dday:hover{background:var(--surface-2)}
.dday.on{background:var(--brand-strong);color:var(--on-strong)}
.dday.tod{box-shadow:inset 0 0 0 2px var(--brand-strong)}

/* tab badge, switches, toast, tooltip */
.tab{position:relative}
.count{background:var(--amber);color:#2b1c00;border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-weight:700}
.swrow{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;padding:6px 12px;background:none;border:0;cursor:pointer;text-align:left;border-radius:10px;min-height:44px;font-size:15px}
.swrow:hover{background:var(--surface-2)}
.sw{width:44px;height:26px;border-radius:999px;background:var(--axis);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--brand-strong)}
.sw.on i{transform:translateX(18px)}
.pref{border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:6px}
#toast{position:fixed;z-index:55;top:calc(env(safe-area-inset-top,0px) + 66px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand-strong);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;font-size:14px}
.toast.warn{border-left-color:var(--amber);background:var(--late-soft)}
.toast b{font-family:var(--font-display);font-weight:600}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;max-width:240px;line-height:1.4}
.tip .tt{color:var(--muted);margin-bottom:3px}
.tip .tr{display:flex;align-items:center;gap:6px}
.tip i{width:10px;height:3px;border-radius:2px;flex:none}
.tip b{font-variant-numeric:tabular-nums}

/* charts */
svg.chart{display:block;max-width:100%;height:auto}
.t{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.tn{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:var(--ink);fill-opacity:.07}
.bar:hover{filter:brightness(1.12)}
.f-good{fill:var(--st-good)} .f-warn{fill:var(--st-warn)} .f-bad{fill:var(--st-bad)}
.f-s1{fill:var(--s1)} .f-s2{fill:var(--s2)} .f-s3{fill:var(--s3)}
.f-line{fill:var(--grid)} .f-hatch{fill:var(--hatch)} .f-surface{fill:var(--surface)}
.k-s1{stroke:var(--s1)} .k-s2{stroke:var(--s2)} .k-s3{stroke:var(--s3)} .k-surface{stroke:var(--surface)} .k-ink{stroke:var(--ink)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill-opacity:.10}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 2px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{overflow-x:auto;margin-top:6px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
.chartcard{display:flex;flex-direction:column}
details.tv{margin-top:8px;font-size:14px}

.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}

.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid.hd span{text-align:center;color:var(--muted);font-size:13px;padding:2px 0}
.mday{min-height:84px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.mday b{font-family:var(--font-display);font-size:14px;font-weight:600}
.mday.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted)}
.mday.tod b{color:var(--brand-strong);text-decoration:underline}
.mday.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.mls{display:flex;flex-direction:column;gap:1px;min-width:0}
.ml{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ml i{width:8px;height:8px;border-radius:50%;background:var(--brand-strong);flex:none}
.ml.off i{background:var(--off)}
.ml.off{color:var(--off)}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mini{padding:12px;display:flex;flex-direction:column;gap:6px}
.mm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mm.hd span{text-align:center;color:var(--muted);font-size:11px}
.md{aspect-ratio:1;border:0;border-radius:4px;font-size:11px;background:var(--brand-soft);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;min-height:0;font-variant-numeric:tabular-nums}
.md.off{background:var(--off);color:#fff}
.md.na{background:var(--hatch);color:var(--muted)}
.md.tod{box-shadow:0 0 0 2px var(--ink)}
.rt{min-width:560px}
.rt th:first-child,.rt td:first-child{width:120px}
.rt .rowhead{font-weight:600;white-space:nowrap}
.rt .rowhead.today{color:var(--brand-strong)}

/* report calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal.hd span{text-align:center;color:var(--muted);font-size:13px}
.cd{min-height:58px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;background:var(--surface);text-align:left;font-variant-numeric:tabular-nums;min-width:0}
.cd b{font-family:var(--font-display);font-size:14px;font-weight:600}
.cd .g{font-weight:700;font-size:15px;line-height:1}
.cd.ok{background:color-mix(in srgb,var(--st-good) 24%,var(--surface));border-color:var(--st-good)}
.cd.warn{background:color-mix(in srgb,var(--st-warn) 30%,var(--surface));border-color:var(--st-warn)}
.cd.bad{background:color-mix(in srgb,var(--st-bad) 24%,var(--surface));border-color:var(--st-bad)}
.cd.open,.cd.future{background:var(--surface-2);color:var(--muted)}
.cd.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.cd.sel{outline:3px solid var(--ink);outline-offset:1px}
.cd.today b{text-decoration:underline}
.strike{text-decoration:line-through;color:var(--muted)}

/* leave */
.lvcard{display:flex;flex-direction:column;gap:8px}
.typeseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typeseg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:500;min-height:44px}
.typeseg button[aria-pressed="true"]{background:var(--brand-strong);color:var(--on-strong);border-color:var(--brand-strong)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bal div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.bal b{font-family:var(--font-display);font-size:22px;display:block;line-height:1.2}

@media (max-width:900px){
  .cgrid{grid-template-columns:minmax(0,1fr)}

@media (max-width:720px){

  .kpi.heroK{grid-column:1/-1}
  .cd{min-height:50px;padding:4px}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function toMin(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}

  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

};

/* ---------- state ---------- */
var LEAVE_TH={vac:'ลาพักร้อน',per:'ลากิจ',sick:'ลาป่วย'},QUOTA={vac:10,per:3,sick:30};
var LEAVE_ST={pending:['รออนุมัติ','late'],approved:['อนุมัติแล้ว',''],rejected:['ไม่อนุมัติ','off'],cancelled:['ยกเลิกแล้ว','mute']};
var state=load();
var me=null,view='home',schedTeam='A',schedMode=window.innerWidth<720?'day':'week',schedAnchor=bkk(now()).date;

function rng(seed){var x=seed>>>0;return function(){x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296;};}
function slotS(S,d,s){
  var team=TEAMS[s.team];
  if(team.days.indexOf(dowOf(d))<0)return null;
  var regular=S.employees.find(function(e){return e.active&&e.role==='staff'&&e.shift===s.id;})||null;
  var o=S.overrides[d+'|'+s.id];
  if(o&&o.off){var c=S.employees.find(function(e){return e.id===o.cover;})||null;return {regular:regular,off:true,cover:c,note:o.note||'',kind:o.kind||'',working:c};}
  return {regular:regular,off:false,cover:null,note:'',kind:'',working:regular};
}
function mkLeave(S,o){
  var e=S.employees.find(function(x){return x.id===o.emp;}),sh=e.shift?shiftById(e.shift):null,days=0;
  var L={id:uid(),emp:o.emp,type:o.type,from:o.from,to:o.to,days:0,reason:o.reason||'',status:o.status,ts:o.ts,by:o.status==='pending'?null:'e0',decidedTs:o.status==='pending'?null:o.ts+3600000,note:o.note||''};
  for(var d=o.from;d<=o.to;d=addDays(d,1)){

function seed(){
  var emps=[
    {id:'e0',username:'admin',name:'ผู้ดูแลระบบ',pin:'000000',role:'admin',team:null,shift:null,phone:'',active:true,canWork:false},

    {id:'e2',username:'malee',name:'มาลี รักงาน',pin:'123456',role:'staff',team:'A',shift:'A2',phone:'081-234-5602',active:true},
    {id:'e3',username:'wichai',name:'วิชัย มั่นคง',pin:'123456',role:'staff',team:'A',shift:'A3',phone:'081-234-5603',active:true},
    {id:'e4',username:'nattaya',name:'ณัฐธิดา สุขใจ',pin:'123456',role:'staff',team:'A',shift:'A4',phone:'081-234-5604',active:true},
    {id:'e5',username:'prasert',name:'ประเสริฐ เก่งกล้า',pin:'123456',role:'staff',team:'B',shift:'B1',phone:'081-234-5605',active:true},
    {id:'e6',username:'kanya',name:'กัญญา ศรีสุข',pin:'123456',role:'staff',team:'B',shift:'B2',phone:'081-234-5606',active:true},
    {id:'e7',username:'anan',name:'อนันต์ ใจเย็น',pin:'123456',role:'staff',team:'OPS',shift:null,phone:'081-234-5607',active:true},
    {id:'e8',username:'porntip',name:'พรทิพย์ คล่องงาน',pin:'123456',role:'staff',team:'OPS',shift:null,phone:'081-234-5608',active:true}
  ];
  var t=Date.now(),today=bkk(t).date,nextMon=addDays(mondayOf(today),7);
  var S={v:3,settings:{openBefore:30,lateAfter:30},employees:emps,overrides:{},attendance:[],notifications:[],leaves:[]};
  var D=function(n){return addDays(today,n);},DAY=864e5;
  mkLeave(S,{emp:'e2',type:'vac',from:D(-62),to:D(-60),cover:'e7',status:'approved',ts:t-64*DAY,reason:'พาครอบครัวเที่ยว'});
  mkLeave(S,{emp:'e3',type:'sick',from:D(-41),to:D(-41),cover:'e8',status:'approved',ts:t-41*DAY,reason:'ไข้หวัด'});
  mkLeave(S,{emp:'e1',type:'per',from:D(-27),to:D(-27),cover:'e7',status:'approved',ts:t-29*DAY,reason:'ธุระครอบครัว'});
  mkLeave(S,{emp:'e5',type:'sick',from:D(-19),to:D(-18),cover:'e8',status:'approved',ts:t-19*DAY,reason:'พบแพทย์'});
  mkLeave(S,{emp:'e4',type:'vac',from:D(-9),to:D(-7),cover:'e8',status:'approved',ts:t-12*DAY,reason:'ลาพักผ่อน'});
  mkLeave(S,{emp:'e6',type:'per',from:D(-4),to:D(-4),cover:'e7',status:'approved',ts:t-5*DAY,reason:'ทำธุระที่ธนาคาร'});
  mkLeave(S,{emp:'e2',type:'per',from:nextMon,to:nextMon,cover:'e7',status:'approved',ts:t-DAY,reason:'ธุระส่วนตัว'});
  mkLeave(S,{emp:'e5',type:'sick',from:addDays(nextMon,4),to:addDays(nextMon,4),cover:'e8',status:'approved',ts:t-7200000,reason:'ไม่สบาย'});
  mkLeave(S,{emp:'e1',type:'vac',from:D(10),to:D(12),status:'pending',ts:t-3*3600000,reason:'ไปต่างจังหวัด'});
  mkLeave(S,{emp:'e3',type:'per',from:D(6),to:D(6),status:'pending',ts:t-5400000,reason:'ไปงานแต่งเพื่อน'});
  mkLeave(S,{emp:'e6',type:'vac',from:D(3),to:D(5),status:'rejected',ts:t-2*DAY,note:'ช่วงนั้นมีคนลาแล้ว ขอเลื่อนเป็นสัปดาห์ถัดไป',reason:'พักผ่อน'});

function notify(to,title,body,kind){
  var ids=[];to.forEach(function(x){if(x&&ids.indexOf(x)<0)ids.push(x);});
  state.notifications.unshift({id:uid(),ts:now(),to:ids,title:title,body:body,read:[],kind:kind||''});
  if(me&&me.notify!==false&&(me.role==='admin'||ids.indexOf(me.id)>=0)){
    toast(title,body,kind);
    if(me.push){try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body:body});}catch(e){}}
  }
}
function visibleNotes(){return state.notifications.filter(function(n){return me.role==='admin'||n.to.indexOf(me.id)>=0;}).sort(function(a,b){return b.ts-a.ts;});}
function unread(){if(me.notify===false)return 0;return visibleNotes().filter(function(n){return n.read.indexOf(me.id)<0;}).length;}

/* slot = who works shift s on date d. null when the team is not operating that day */
function slot(d,s){return slotS(state,d,s);}
function busyIn(empId,a,b,skipKey,d){
  for(var i=-1;i<=1;i++){
    var dd=addDays(d,i);
    for(var j=0;j<SHIFTS.length;j++){
      var s2=SHIFTS[j];if(dd+'|'+s2.id===skipKey)continue;
      var sl=slot(dd,s2);
      if(sl&&sl.working&&sl.working.id===empId&&startTs(dd,s2)<b&&endTs(dd,s2)>a)return shiftLabel(s2)+' '+thDate(dd,{day:'numeric',month:'short'});
    }
  }
  return '';
}

/* ---------- time rules ---------- */
function inInfo(stts,t){
  var L=ST().lateAfter,d=Math.trunc((t-stts)/60000);
  if(d>L)return {flag:true,late:d,cls:'late',label:'สาย '+d+' นาที',detail:'เข้างานหลังเวลาเริ่มกะ '+d+' นาที เกินเวลาผ่อนผัน '+L+' นาที'};
  if(d>0)return {flag:false,late:d,cls:'',label:'ตรงเวลา',detail:'เข้างานหลังเริ่มกะ '+d+' นาที ยังอยู่ในเวลาผ่อนผัน ('+L+' นาที)'};
  if(d<0)return {flag:false,late:0,cls:'',label:'ตรงเวลา',detail:'เข้างานก่อนเริ่มกะ '+(-d)+' นาที'};
  return {flag:false,late:0,cls:'',label:'ตรงเวลา',detail:'เข้างานตรงเวลาเริ่มกะ'};
}
function outInfo(en,t){
  var d=Math.trunc((en-t)/60000);
  if(d>0)return {flag:true,early:d,cls:'late',label:'ออกก่อน '+d+' นาที',detail:'ออกงานก่อนเวลาเลิกกะ '+d+' นาที'};
  return {flag:false,early:0,cls:'',label:'ตรงเวลา',detail:d<0?'ออกงานหลังเวลาเลิกกะ '+(-d)+' นาที':'ออกงานตรงเวลาเลิกกะ'};
}
function chipsFor(a){
  var h=a.lateFlag?'<span class="chip late">สาย '+a.late+' นาที</span>':'<span class="chip">ตรงเวลา</span>';
  if(a.out&&a.earlyFlag)h+=' <span class="chip late">ออกก่อน '+a.early+' นาที</span>';
  return h;
}

/* check-in card + my shifts (staff, Ops, and admins who can work) */
function myStatus(){
  var t=now(),today=bkk(t).date,O=ST().openBefore*60000;
  var open=state.attendance.find(function(a){return a.emp===me.id&&!a.out&&endTs(a.date,shiftById(a.shift))+12*3600000>t;});
  if(open){var s=shiftById(open.shift);return {mode:'out',rec:open,shift:s,st:startTs(open.date,s),en:endTs(open.date,s),isCover:open.cover};}
  var cand=null,next=null;
  for(var i=-1;i<=14;i++){
    var d=addDays(today,i);
    for(var j=0;j<SHIFTS.length;j++){
      var s2=SHIFTS[j],sl=slot(d,s2);
      if(!sl||!sl.working||sl.working.id!==me.id)continue;
      if(state.attendance.some(function(a){return a.emp===me.id&&a.date===d&&a.shift===s2.id;}))continue;
      var st=startTs(d,s2),en=endTs(d,s2),c={date:d,shift:s2,st:st,en:en,isCover:sl.off};
      if(t>=st-O&&t<=en){if(!cand||st<cand.st)cand=c;}
      else if(en>t&&(!next||st<next.st))next=c;
    }
  }
  if(cand){cand.mode='in';return cand;}
  return {mode:next?'wait':'none',next:next};
}
function myUpcoming(){
  var today=bkk(now()).date,rows=[];
  for(var i=0;i<7;i++){
    var d=addDays(today,i);
    SHIFTS.forEach(function(s){
      var sl=slot(d,s);if(!sl)return;
      if(sl.working&&sl.working.id===me.id)rows.push({d:d,s:s,kind:sl.off?'cover':'own',other:sl.regular});
      else if(sl.off&&sl.regular&&sl.regular.id===me.id)rows.push({d:d,s:s,kind:'off',other:sl.cover});
    });
  }
  return rows;
}
function upcomingHtml(){
  var rows=myUpcoming().map(function(r){
    var tag=r.kind==='own'?'<span class="chip mute">ตามปกติ</span>':(r.kind==='cover'?'<span class="chip">ทำแทน '+esc(fn(r.other))+'</span>':'<span class="chip off">หยุด · '+esc(fn(r.other))+' ทำแทน</span>');
    return '<div class="li"><span class="when">'+esc(dayShort(r.d))+' · <span class="tnum">'+shiftLabel(r.s)+'</span></span>'+tag+'</div>';
  }).join('')||'<p class="muted small" style="padding:10px 0">ไม่มีกะใน 7 วันข้างหน้า'+(me.team==='OPS'?' (พนักงานสำรองจะมีกะเมื่อผู้ดูแลมอบหมายให้ทำแทน)':'')+'</p>';
  var sub=me.role==='admin'?'ผู้ดูแลระบบ · ช่วยทำงานได้':esc(me.name)+' · '+TEAMS[me.team].name+(TEAMS[me.team].days.length?' ('+TEAMS[me.team].dayText+')':'')+(me.shift?' · กะประจำ '+shiftLabel(shiftById(me.shift)):'');
  return '<section class="card"><h2>กะของฉัน</h2><p class="muted small" style="margin:2px 0 6px">'+sub+'</p><div class="list">'+rows+'</div></section>';
}
function checkCardHtml(){
  var st=myStatus(),t=now(),today=bkk(t).date,btn='',msg='',warn=false,p=0,info='',L=ST().lateAfter,O=ST().openBefore;
  if(st.mode==='out'){
    p=Math.max(0,Math.min(100,(t-st.st)/(st.en-st.st)*100));
    var left=st.en-t;
    msg='เข้างาน '+fmtHM(st.rec.in)+' น. · '+(left>0?'เหลืออีก '+hm(left):'เลยเวลาเลิกกะ '+hm(-left)+' แล้ว');
    btn='<button class="out" data-act="checkout"><span>ออกงาน</span><small>Check-out</small></button>';
    info='กะ '+shiftLabel(st.shift)+(st.isCover?' <span class="chip">ทำแทน</span>':'');
    if(left>=60000)msg+=' · ออกก่อนเวลาเลิกกะจะบันทึกเป็น "ออกก่อน"';
  }else if(st.mode==='in'){
    var d=Math.trunc((t-st.st)/60000);
    if(d>L){warn=true;msg='เลยเวลาเริ่มกะ '+d+' นาที เกินเวลาผ่อนผัน '+L+' นาที เข้างานตอนนี้จะบันทึกเป็นสาย';}
    else if(d>0)msg='เลยเวลาเริ่มกะ '+d+' นาที ยังอยู่ในเวลาผ่อนผัน (ถึง '+L+' นาที)';
    else if(d<0)msg='กะเริ่ม '+fmtHM(st.st)+' น. (อีก '+(-d)+' นาที) ลงเวลาล่วงหน้าได้';
    else msg='ถึงเวลาเข้างานแล้ว';
    btn='<button data-act="checkin"><span>เข้างาน</span><small>Check-in</small></button>';
    info='กะ '+shiftLabel(st.shift)+(st.isCover?' <span class="chip">ทำแทน</span>':'');
  }else if(st.mode==='wait'){
    msg='กะถัดไป '+dayShort(st.next.date)+' '+shiftLabel(st.next.shift)+' · เปิดให้ลงเวลา '+fmtHM(st.next.st-O*60000)+' น.';
    btn='<button disabled><span>เข้างาน</span><small>Check-in</small></button>';
    info='ยังไม่ถึงเวลาลงเวลา';
  }else{
    msg=me.team==='OPS'||me.role==='admin'?'ยังไม่มีกะทำแทนใน 14 วันข้างหน้า':'ไม่พบกะที่กำหนดใน 14 วันข้างหน้า';
    btn='<button disabled><span>เข้างาน</span><small>Check-in</small></button>';
    info='ยังไม่มีกะ';
  }
  var f=flash;flash=null;
  return '<section class="card hero"><p class="muted center">'+esc(thDate(today,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</p>'+
    '<div class="clock tnum" id="clk">'+bkk(t).hms+'</div>'+
    '<div class="ring" style="--p:'+p.toFixed(1)+'">'+btn+'</div>'+
    '<p class="center"><b>'+info+'</b></p>'+
    '<p class="center'+(warn?' alert-y':' muted small')+'" style="margin-top:6px">'+esc(msg)+'</p>'+
    (f?'<p class="center '+(f.warn?'alert-y':'ok')+'" style="margin-top:8px" role="status">'+esc(f.t)+'</p>':'')+
    '<p class="center muted small" style="margin-top:8px">เปิดให้ลงเวลาก่อนเริ่มกะ '+O+' นาที · สายเมื่อเกิน '+L+' นาทีหลังเริ่มกะ</p></section>';
}

/* ---------- slot analysis (shared by dashboard + report) ---------- */
function attIdx(){var m={};state.attendance.forEach(function(a){m[a.emp+'|'+a.date+'|'+a.shift]=a;});return m;}
function slotInfo(d,s,idx,t){
  var sl=slot(d,s);if(!sl)return null;
  var w=sl.working,rec=w?(idx[w.id+'|'+d+'|'+s.id]||null):null,st=startTs(d,s),en=endTs(d,s),L=ST().lateAfter*60000,k;
  if(!w)k='vacant';
  else if(rec)k=!rec.out?(t<en?'working':'incomplete'):((rec.lateFlag||rec.earlyFlag)?'late':'ok');
  else if(t<st)k='future';
  else if(t<=st+L)k='waiting';
  else if(t<en)k='noshow';
  else k='missing';
  return {d:d,s:s,sl:sl,w:w,rec:rec,k:k,st:st,en:en};
}
function dayStatus(d,idx,t){
  var rows=[],bad=0,warn=0,okN=0,close=Date.parse(addDays(d,1)+'T00:00:00+07:00');
  SHIFTS.forEach(function(s){
    var r=slotInfo(d,s,idx,t);if(!r||!r.w)return;
    rows.push(r);if(r.en>close)close=r.en;
    if(r.k==='missing'||r.k==='incomplete')bad++;else if(r.k==='late')warn++;else if(r.k==='ok')okN++;
  });
  var closed=t>=close,st=!rows.length?'none':!closed?(d>bkk(t).date?'future':'open'):(bad?'bad':warn?'warn':'ok');
  return {d:d,rows:rows,bad:bad,warn:warn,ok:okN,state:st};
}
function kChip(r){
  var a=r.rec;
  switch(r.k){
    case 'ok':return '<span class="chip">ตรงเวลา</span>';
    case 'late':return chipsFor(a);
    case 'working':return chipsFor(a)+' <span class="chip">ทำงานอยู่</span>';
    case 'incomplete':return chipsFor(a)+' <span class="chip off">ลืมออกงาน</span>';
    case 'missing':return '<span class="chip off">ไม่มีบันทึก</span>';
    case 'noshow':return '<span class="chip late">ยังไม่เข้างาน</span>';
    case 'waiting':return '<span class="chip mute">รอเข้างาน</span>';
    case 'future':return '<span class="chip mute">ยังไม่ถึงเวลา</span>';
    default:return '<span class="chip mute">ไม่มีผู้ทำงาน</span>';
  }
}

function niceMax(v){if(v<=5)return Math.max(1,Math.ceil(v));var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;}

var C_FILL=['f-s1','f-s2','f-s3'],C_VAR=['var(--s1)','var(--s2)','var(--s3)'];

function chStacked(rows,w,h,series,label){
  var L=32,R=6,Tp=8,B=24,iw=w-L-R,ih=h-Tp-B,n=rows.length,band=iw/n,bw=Math.min(24,Math.max(2,band-2));

  rows.forEach(function(r,i){

      if(r.rec){
        var a=r.rec,off=Math.trunc((a.in-r.st)/60000);
        p.sumOff+=off;p.nOff++;
        var z=sh[r.s.id]||(sh[r.s.id]={sum:0,n:0,late:0});z.sum+=off;z.n++;
        hist[off<-15?0:off<0?1:off<15?2:off<=30?3:off<=60?4:5]++;

        if(a.out){var hrs=(a.out-a.in)/3600000;p.hrs+=hrs;tot.hours+=hrs;if(r.s.team==='A')c.hA+=hrs;else c.hB+=hrs;T.hrs+=hrs;if(a.earlyFlag){tot.early++;p.early++;}}
      }

    });
    daysArr.push(c);
  }
  return {t:t,today:today,idx:idx,daysArr:daysArr,per:Object.keys(per).map(function(k){return per[k];}),sh:sh,tm:tm,dow:dow,hist:hist,cover:cover,leave:leave,tot:tot};

function pct(a,b){return b?Math.round(100*a/b):0;}

/* ---------- live board (today) ---------- */
function liveBoard(t,today,idx){
  var yest=addDays(today,-1),cards=[],working=0,waiting=0,late=0,offN=0;
  [yest,today].forEach(function(d){
    SHIFTS.forEach(function(s){
      var r=slotInfo(d,s,idx,t);if(!r)return;
      if(d===yest&&(!crosses(s)||r.en<=t))return;
      if(r.sl.off&&d===today)offN++;
      if(r.k==='working')working++;
      if(r.k==='waiting'||r.k==='future')waiting++;
      if(r.k==='noshow'||(r.rec&&r.rec.lateFlag))late++;
      var who=r.w?'<b>'+esc(r.w.name)+'</b>'+(r.sl.off?' <span class="chip">ทำแทน '+esc(fn(r.sl.regular))+'</span>'+tagFor(r.w):''):'<span class="muted">—</span>';
      cards.push('<article class="card pcard"><div class="row between"><b class="tnum">'+(d===yest?'<span class="muted small">เมื่อวาน </span>':'')+shiftLabel(s)+'</b><span class="muted small">'+TEAMS[s.team].name+'</span></div><div>'+who+'</div><div class="row" style="gap:6px">'+kChip(r)+(r.rec?'<span class="muted small tnum">เข้า '+fmtHM(r.rec.in)+'</span>':'')+'</div></article>');
    });
  });
  return {cards:cards,working:working,waiting:waiting,late:late,off:offN};
}

function schedRange(){
  var today=bkk(now()).date,f=getDv('rgFrom',today),t=getDv('rgTo',addDays(today,13));
  if(f>t){var x=f;f=t;t=x;}
  var cut=false;if(Date.parse(t)-Date.parse(f)>61*864e5){t=addDays(f,61);cut=true;}
  var out=[];for(var d=f;d<=t;d=addDays(d,1))out.push(d);
  return {f:f,t:t,days:out,cut:cut};
}

function saveEmp(){
  var g=$,isNew=editEmp==='new',cur=isNew?null:emp(editEmp);
  var name=g('fName').value.trim(),username=g('fUser').value.trim().toLowerCase(),pin=g('fPin').value.trim(),phone=g('fPhone').value.trim();
  var role=g('fRole').value,active=g('fActive').checked,errs=[];
  var team=role==='admin'?null:g('fTeam').value;
  var shift=(role==='admin'||team==='OPS')?null:g('fShift').value;
  var canWork=role==='admin'&&g('fWork').checked;
  if(!name)errs.push('กรอกชื่อ-นามสกุล');
  if(!/^[a-z0-9._-]{3,20}$/.test(username))errs.push('ชื่อผู้ใช้ 3–20 ตัว ใช้ a-z 0-9 . _ - เท่านั้น');
  else if(state.employees.some(function(e){return e.username===username&&(!cur||e.id!==cur.id);}))errs.push('ชื่อผู้ใช้นี้ถูกใช้แล้ว');
  if((isNew||pin)&&!/^\d{6}$/.test(pin))errs.push('รหัสผ่านต้องเป็นตัวเลข 6 หลัก');
  if(role==='staff'&&team!=='OPS'){
    if(!shift)errs.push('เลือกกะประจำ');
    else if(active){
      var holder=state.employees.find(function(e){return e.active&&e.role==='staff'&&e.shift===shift&&(!cur||e.id!==cur.id);});
      if(holder)errs.push('กะนี้มี '+holder.name+' ประจำอยู่แล้ว ย้ายคนนั้นไปกะอื่นก่อน');
    }
  }
  if(cur&&cur.id===me.id&&(role!=='admin'||!active))errs.push('ไม่สามารถลดสิทธิ์หรือปิดใช้งานบัญชีของตัวเอง');
  if(errs.length){g('fErr').textContent=errs.join(' · ');return;}
  var teamTxt=team==='OPS'?'Operation (Daytime)':(team?TEAMS[team].name+' กะ '+shiftLabel(shiftById(shift)):'ผู้ดูแล');
  if(isNew){
    var ne={id:'e'+uid(),username:username,name:name,pin:pin,role:role,team:team,shift:shift,phone:phone,active:active,canWork:canWork};
    state.employees.push(ne);
    notify([ne.id,me.id],'สร้างบัญชีใหม่','ผู้ดูแลสร้างบัญชีให้ '+name+' ('+teamTxt+')');
  }else{
    var ch=[];
    if(cur.name!==name)ch.push('ชื่อ');
    if(cur.team!==team||cur.shift!==shift)ch.push('ทีม/กะประจำ เป็น '+teamTxt);
    if(cur.active!==active)ch.push(active?'เปิดใช้งานบัญชี':'ปิดใช้งานบัญชี');
    if(!!cur.canWork!==canWork)ch.push(canWork?'เปิดสิทธิ์ช่วยทำงานแทน':'ปิดสิทธิ์ช่วยทำงานแทน');
    if(pin)ch.push('รหัสผ่าน');
    if(cur.role!==role)ch.push('บทบาท');
    Object.assign(cur,{username:username,name:name,role:role,team:team,shift:shift,phone:phone,active:active,canWork:canWork});
    if(pin)cur.pin=pin;
    if(ch.length)notify([cur.id,me.id],'แก้ไขโปรไฟล์','ผู้ดูแลแก้ไขข้อมูล '+name+': '+ch.join(', '));
  }
  editEmp=null;save();renderAll();
}
function deleteEmp(id){
  var e=emp(id);if(!e||e.id===me.id)return;
  state.employees=state.employees.filter(function(x){return x.id!==id;});
  Object.keys(state.overrides).forEach(function(k){
    if(state.overrides[k].cover===id||(e.shift&&k.split('|')[1]===e.shift))delete state.overrides[k];
  });
  state.attendance=state.attendance.filter(function(a){return a.emp!==id;});
  state.leaves=state.leaves.filter(function(l){return l.emp!==id;});
  notify([me.id],'ลบพนักงาน','ลบโปรไฟล์ '+e.name+' แล้ว (ประวัติลงเวลาและรายการทำแทนของคนนี้ถูกลบด้วย)');
  armed='';save();renderAll();
}

/* settings: rules + schedule import/export (admin) */
function buildCsv(from,to){
  var rows=[['date','day','team','shift_start','shift_end','regular_username','regular_name','status','cover_username','cover_name','note']];
  for(var d=from,n=0;d<=to&&n<62;d=addDays(d,1),n++){
    SHIFTS.forEach(function(s){
      var sl=slot(d,s);if(!sl)return;
      var o=sl.off?state.overrides[d+'|'+s.id]:null;
      rows.push([d,DOW_TH[dowOf(d)],TEAMS[s.team].name,s.start,s.end,sl.regular?sl.regular.username:'',sl.regular?sl.regular.name:'',sl.off?'หยุด':'ทำงาน',sl.off&&sl.cover?sl.cover.username:'',sl.off&&sl.cover?sl.cover.name:'',o?o.note:'']);
    });
  }
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim()!=='';}))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(function(x){return x.trim()!=='';}))rows.push(row);
  return rows;
}
function checkCsv(text){
  var rows=parseCsv(text);
  if(rows.length<2)return {error:'ไม่พบข้อมูล ต้องมีหัวตารางและอย่างน้อย 1 แถว'};
  var h=rows[0].map(function(x){return x.trim().toLowerCase();});
  var ix={};['date','team','shift_start','status','cover_username','note'].forEach(function(k){ix[k]=h.indexOf(k);});
  var miss=['date','team','shift_start','status'].filter(function(k){return ix[k]<0;});
  if(miss.length)return {error:'หัวตารางขาดคอลัมน์: '+miss.join(', ')};
  var results=[];
  rows.slice(1).forEach(function(r,i){

      else if(!off&&!work)res.msg='สถานะต้องเป็น ทำงาน หรือ หยุด';
      else if(work){res.ok=true;res.action={key:res.date+'|'+s.id,off:false};res.change=sl.off?'ยกเลิกการหยุด':'ไม่เปลี่ยน';}
      else{
        var cu=get('cover_username').toLowerCase(),c=state.employees.find(function(e){return e.username===cu&&canCover(e);});

        else if(c.id===sl.regular.id)res.msg='ผู้ทำงานแทนต้องไม่ใช่คนเดียวกับผู้ประจำ';
        else{

        }

}

function leaveSlots(l){
  var e=emp(l.emp),out=[];if(!e||!e.shift)return out;
  var s=shiftById(e.shift);
  for(var d=l.from;d<=l.to;d=addDays(d,1))if(TEAMS[s.team].days.indexOf(dowOf(d))>=0)out.push({d:d,s:s,key:d+'|'+s.id});
  return out;
}
function countDays(empId,from,to){return leaveSlots({emp:empId,from:from,to:to}).length;}
function usedDays(empId,type,statuses){
  var y=bkk(now()).date.slice(0,4);
  return state.leaves.filter(function(l){return l.emp===empId&&l.type===type&&statuses.indexOf(l.status)>=0&&l.from.slice(0,4)===y;}).reduce(function(a,l){return a+l.days;},0);
}

  }).join('')||'<section class="card"><p class="muted">ไม่มีรายการ</p></section>';
  return '<div class="stack"><div><h1>คำขอลา</h1><p class="muted">อนุมัติแล้วระบบจะตั้งกะเป็นหยุดและระบุผู้ทำแทนในตารางให้อัตโนมัติ</p></div>'+
    '<div class="seg" style="align-self:flex-start" role="group" aria-label="กรองสถานะ">'+seg.map(function(s){return '<button data-act="lvf" data-f="'+s[0]+'" aria-pressed="'+(f===s[0])+'">'+s[1]+(s[0]==='pending'&&pendingLeaves()?' ('+pendingLeaves()+')':'')+'</button>';}).join('')+'</div>'+
    '<div class="stack">'+cards+'</div></div>';
}
function approveLeave(id){
  var l=state.leaves.find(function(x){return x.id===id;});if(!l||l.status!=='pending')return;
  var e=emp(l.emp),slots=leaveSlots(l),picks=[],bad='';
  slots.forEach(function(x,i){var sel=$('cv'+i);var v=sel?sel.value:'';if(!v)bad='เลือกผู้ทำแทนให้ครบทุกกะ';picks.push(v);});
  if(bad){lvErr=bad;renderView();return;}
  var covers=[];
  slots.forEach(function(x,i){
    state.overrides[x.key]={off:true,cover:picks[i],note:LEAVE_TH[l.type],kind:l.type,by:me.id,ts:now(),leave:l.id};
    covers.push({id:picks[i],x:x});
  });
  l.status='approved';l.by=me.id;l.decidedTs=now();
  notify([l.emp],'อนุมัติการลา','ผู้ดูแลอนุมัติ'+LEAVE_TH[l.type]+' '+sd(l.from)+(l.to!==l.from?' – '+sd(l.to):'')+' ของ '+e.name);
  var byC={};covers.forEach(function(c){(byC[c.id]=byC[c.id]||[]).push(sd(c.x.d)+' '+shiftLabel(c.x.s));});
  Object.keys(byC).forEach(function(cid){notify([cid],'มอบหมายให้ทำแทน','ทำแทน '+e.name+': '+byC[cid].join(', '));});
  lvOpen=null;lvErr='';save();renderAll();
}

/* ---------- date picker ---------- */
var PAIRS={rgFrom:['rgFrom','rgTo'],rgTo:['rgFrom','rgTo'],rpFrom:['rpFrom','rpTo'],rpTo:['rpFrom','rpTo'],expFrom:['expFrom','expTo'],expTo:['expFrom','expTo'],lvFrom:['lvFrom','lvTo'],lvTo:['lvFrom','lvTo']};
function dateField(id,val){
  if(val===undefined)val=dv[id]||bkk(now()).date;else if(id!=='simD')dv[id]=val;
  return '<button type="button" class="dfield" data-act="dp" data-id="'+id+'" aria-label="เลือกวันที่ ปัจจุบัน '+esc(thDate(val,{day:'numeric',month:'long',year:'numeric'}))+'"><span>'+esc(thDate(val,{weekday:'short',day:'numeric',month:'short',year:'numeric'}))+'</span>'+ico(ICONS.cal)+'</button>';
}
function renderDp(){
  var box=$('dpbox');if(!box)return;
  if(!dp){box.innerHTML='';return;}
  var today=bkk(now()).date,cur=dp.sel;
  var cells=monthGrid(dp.month).map(function(d){
    if(d.slice(0,7)!==dp.month)return '<span></span>';
    return '<button type="button" class="dday'+(d===cur?' on':'')+(d===today?' tod':'')+'" data-act="dp-pick" data-d="'+d+'" aria-label="'+esc(thDate(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'"'+(d===cur?' aria-pressed="true"':'')+'>'+(+d.slice(8))+'</button>';
  }).join('');
  box.innerHTML='<div class="overlay" data-act="dp-bg"><div class="modal dpm" role="dialog" aria-modal="true" aria-label="เลือกวันที่"><div class="row between"><button class="btn sec sm" data-act="dp-m" data-n="-1" aria-label="เดือนก่อน">‹</button><b>'+esc(thDate(dp.month+'-01',{month:'long',year:'numeric'}))+'</b><button class="btn sec sm" data-act="dp-m" data-n="1" aria-label="เดือนถัดไป">›</button></div>'+
    '<div class="dgrid dh">'+WEEK_ORDER.map(function(w){return '<span>'+DOW_S[w].replace('.','')+'</span>';}).join('')+'</div><div class="dgrid">'+cells+'</div>'+
    '<div class="row between"><button class="btn sec sm" data-act="dp-today">วันนี้</button><button class="btn sec sm" data-act="dp-close">ปิด</button></div></div></div>';
}
function onDate(id,val){
  var p=PAIRS[id];
  if(p){
    dv[id]=val;
    var f=dv[p[0]],t=dv[p[1]];
    if(f&&t&&f>t){if(id===p[0])dv[p[1]]=val;else dv[p[0]]=val;}
  }
  switch(id){
    case 'simD':var tm=$('simTm');clockOffset=Date.parse(val+'T'+(tm&&tm.value?tm.value:'12:00')+':00+07:00')-Date.now();renderAll();return;
    case 'jump':schedAnchor=val;break;
    case 'rpFrom':case 'rpTo':rep.csv='';break;
    case 'expFrom':case 'expTo':io.exp='';break;
    case 'lvFrom':case 'lvTo':lv.err='';lv.ok='';break;
  }
  renderView();
}

/* ---------- toast + tooltip ---------- */
function toast(title,body,kind){
  var box=$('toast');if(!box)return;
  var el=document.createElement('div');el.className='toast'+(kind==='warn'?' warn':'');
  var b=document.createElement('b');b.textContent=title;var s=document.createElement('span');s.textContent=body||'';
  el.appendChild(b);el.appendChild(s);box.appendChild(el);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},5500);
}
function showTip(el,x,y){
  var tip=$('tip');if(!tip)return;
  var lines=el.getAttribute('data-tip').split('\n');
  tip.textContent='';
  var tt=document.createElement('div');tt.className='tt';tt.textContent=lines[0];tip.appendChild(tt);
  lines.slice(1).forEach(function(ln){
    var p=ln.split('|'),r=document.createElement('div');r.className='tr';
    if(p[2]){var i=document.createElement('i');i.style.background=p[2];r.appendChild(i);}
    var v=document.createElement('b');v.textContent=p[1]||'';var n=document.createElement('span');n.className='muted';n.textContent=p[0];
    r.appendChild(v);r.appendChild(n);tip.appendChild(r);
  });
  tip.hidden=false;
  var w=tip.offsetWidth,h=tip.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  var px=x+14,py=y+14;if(px+w>vw-8)px=Math.max(8,x-w-14);if(py+h>vh-8)py=Math.max(8,y-h-14);
  tip.style.left=px+'px';tip.style.top=py+'px';
}
function hideTip(){var t=$('tip');if(t)t.hidden=true;}
document.addEventListener('pointermove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});
document.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});
document.addEventListener('scroll',hideTip,true);

/* ---------- events ---------- */
function resetUi(){editSlot=null;editEmp=null;armed='';io.preview=null;io.msg='';io.ruleMsg='';io.ruleErr='';bellOpen=false;lvOpen=null;lvReject=null;lvErr='';lv.err='';lv.ok='';rep.calSel='';dp=null;}
document.addEventListener('click',function(e){
  if(bellOpen&&!e.target.closest('.bellwrap')){bellOpen=false;renderChrome();}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,D=el.dataset;
  switch(a){
    case 'theme':toggleTheme();break;
    case 'logout':me=null;view='home';modal=null;bellOpen=false;dp=null;renderAll();break;
    case 'bell':bellOpen=!bellOpen;renderChrome();break;
    case 'bell-notify':me.notify=(me.notify===false);save();renderChrome();toast(me.notify===false?'ปิดแจ้งเตือนในเว็บแล้ว':'เปิดแจ้งเตือนในเว็บแล้ว',me.notify===false?'จะไม่มีป๊อปอัปและตัวเลขที่กระดิ่ง (ยังดูรายการได้)':'จะมีป๊อปอัปและตัวเลขที่กระดิ่งเมื่อมีการแจ้งเตือน');break;
    case 'bell-push':
      if(me.push){me.push=false;save();renderChrome();break;}
      try{
        if(!window.Notification)throw new Error('none');
        Notification.requestPermission().then(function(p){
          me.push=(p==='granted');save();renderChrome();
          toast(me.push?'เปิด Push แล้ว':'เบราว์เซอร์ไม่อนุญาต',me.push?'ต้นแบบนี้เด้งเฉพาะตอนเปิดหน้าเว็บอยู่ ระบบจริงหลัง deploy จะส่งเข้าเครื่องแม้ปิดเว็บ':'อนุญาตการแจ้งเตือนในตั้งค่าเบราว์เซอร์ก่อน');
        },function(){toast('เปิด Push ไม่ได้','เบราว์เซอร์ไม่อนุญาตในหน้านี้');});
      }catch(err){toast('เครื่องนี้ยังเปิด Push ไม่ได้','Push จริงต้องติดตั้งเว็บลงหน้าจอโฮมหลัง deploy');}
      break;
    case 'tab':view=D.v;resetUi();renderAll();window.scrollTo(0,0);break;
    case 'dash':dashDays=Number(D.n);renderView();break;
    case 'fill':$('lu').value=D.u;$('lp').value=D.p;break;
    case 'real-time':clockOffset=0;renderAll();break;
    case 'checkin':openModal('in');break;
    case 'checkout':openModal('out');break;
    case 'modal-ok':confirmModal();break;
    case 'modal-cancel':closeModal();break;
    case 'modal-bg':if(e.target===el)closeModal();break;
    case 'team':schedTeam=D.t;editSlot=null;renderView();break;
    case 'mode':schedMode=D.m;editSlot=null;renderView();break;
    case 'sched-nav':schedNav(D.n);editSlot=null;renderView();break;
    case 'pick-day':schedAnchor=D.d;renderView();break;
    case 'pick-month':schedAnchor=D.d;schedMode='month';renderView();break;
    case 'rg-preset':
      var td=bkk(now()).date,pi=Number(D.i);
      if(pi===3){dv.rgFrom=mondayOf(td);dv.rgTo=addDays(mondayOf(td),6);}
      else{dv.rgFrom=td;dv.rgTo=addDays(td,[6,13,29][pi]);}
      renderView();break;
    case 'edit-slot':editSlot={d:D.d,s:D.s};renderView();var ed=$('slotEd');if(ed&&ed.scrollIntoView)ed.scrollIntoView({block:'center',behavior:'smooth'});break;
    case 'cancel-slot':editSlot=null;renderView();break;
    case 'save-slot':saveSlot();break;
    case 'new-emp':editEmp='new';armed='';renderView();var ee=$('empEd');if(ee&&ee.scrollIntoView)ee.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'edit-emp':editEmp=D.id;armed='';renderView();var ee2=$('empEd');if(ee2&&ee2.scrollIntoView)ee2.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'cancel-emp':editEmp=null;renderView();break;
    case 'save-emp':saveEmp();break;
    case 'del-emp':armed='del:'+D.id;renderView();break;
    case 'del-no':armed='';renderView();break;
    case 'del-yes':deleteEmp(D.id);break;
    case 'hist':histMonth=addMonth(histMonth,Number(D.n));renderView();break;
    case 'read':var n=state.notifications.find(function(x){return x.id===D.id;});if(n&&n.read.indexOf(me.id)<0){n.read.push(me.id);save();renderChrome();}break;
    case 'read-all':visibleNotes().forEach(function(x){if(x.read.indexOf(me.id)<0)x.read.push(me.id);});save();renderChrome();break;
    case 'save-rules':
      var o=parseInt($('setOpen').value,10),l=parseInt($('setLate').value,10);
      io.ruleMsg='';io.ruleErr='';
      if(isNaN(o)||isNaN(l)||o<0||o>240||l<0||l>240){io.ruleErr='ใส่ตัวเลข 0–240 นาที';renderView();break;}
      if(o!==ST().openBefore||l!==ST().lateAfter){
        state.settings={openBefore:o,lateAfter:l};
        notify(state.employees.filter(function(x){return x.active;}).map(function(x){return x.id;}),'ปรับกฎการลงเวลา','เปิดให้ลงเวลาก่อนเริ่มกะ '+o+' นาที · ถือว่าสายเมื่อเข้างานเกิน '+l+' นาทีหลังเริ่มกะ');
      }
      io.ruleMsg='บันทึกกฎแล้ว';save();renderAll();break;
    case 'mk-rep':rep.csv=buildRepCsv(repRows());renderView();break;
    case 'mk-csv':
      var f=getDv('expFrom',mondayOf(bkk(now()).date)),t=getDv('expTo',f);
      if(!f||!t||f>t){$('expMsg').textContent='เลือกช่วงวันที่ให้ถูกต้อง';break;}
      io.exp=buildCsv(f,t);renderView();break;
    case 'copy-csv':
      var ta=$(D.ta),mg=$(D.m),txt=ta?ta.value:'';
      var fb=function(){if(ta){ta.focus();ta.select();}if(mg)mg.textContent='เลือกข้อความแล้ว กด Ctrl+C หรือแตะค้างเพื่อคัดลอก';};
      try{navigator.clipboard.writeText(txt).then(function(){if(mg)mg.textContent='คัดลอกแล้ว';},fb);}catch(err){fb();}
      break;
    case 'sample-csv':
      var m0=mondayOf(bkk(now()).date);io.csv=buildCsv(addDays(m0,7),addDays(m0,13));io.preview=null;io.msg='';renderView();break;
    case 'check-csv':io.csv=$('csvIn').value;io.msg='';io.preview=checkCsv(io.csv);renderView();break;
    case 'apply-csv':io.csv=$('csvIn')?$('csvIn').value:io.csv;applyCsv();break;
    case 'reset':
      if(armed!=='reset'){armed='reset';renderView();break;}
      state=seed();save();armed='';io={exp:'',csv:'',preview:null,msg:'',ruleMsg:'',ruleErr:''};rep={team:'',emp:'',csv:'',calMonth:'',calSel:''};dv={};lv={type:'vac',reason:'',err:'',ok:''};editSlot=null;editEmp=null;modal=null;dp=null;
      me=state.employees.find(function(x){return x.id==='e0';});renderAll();break;
    case 'calnav':rep.calMonth=addMonth(rep.calMonth||bkk(now()).date.slice(0,7),Number(D.n));rep.calSel='';renderView();break;
    case 'calpick':rep.calSel=(rep.calSel===D.d)?'':D.d;renderView();break;
    case 'lvtype':lv.type=D.t;lv.err='';renderView();break;
    case 'lv-submit':submitLeave();break;
    case 'lv-cancel':
      var lc=state.leaves.find(function(x){return x.id===D.id;});
      if(lc&&lc.status==='pending'){lc.status='cancelled';notify([],'ยกเลิกคำขอลา',me.name+' ยกเลิกคำขอ'+LEAVE_TH[lc.type]+' '+sd(lc.from));save();renderAll();}break;
    case 'lvf':lvFilter=D.f;lvOpen=null;lvReject=null;lvErr='';renderView();break;
    case 'lv-open':lvOpen=D.id;lvReject=null;lvErr='';renderView();break;
    case 'lv-rej-open':lvReject=D.id;lvOpen=null;lvNote='';renderView();break;
    case 'lv-close':lvOpen=null;lvReject=null;lvErr='';renderView();break;
    case 'lv-approve':approveLeave(D.id);break;
    case 'lv-reject-yes':
      var lr=state.leaves.find(function(x){return x.id===D.id;});
      if(lr&&lr.status==='pending'){
        lr.status='rejected';lr.by=me.id;lr.decidedTs=now();lr.note=lvNote.trim();
        notify([lr.emp],'ไม่อนุมัติการลา','คำขอ'+LEAVE_TH[lr.type]+' '+sd(lr.from)+(lr.to!==lr.from?' – '+sd(lr.to):'')+' ไม่ได้รับอนุมัติ'+(lr.note?' · '+lr.note:''),'warn');
      }
      lvReject=null;save();renderAll();break;
    case 'dp':dp={id:D.id,month:(getDv(D.id,bkk(now()).date)||bkk(now()).date).slice(0,7),sel:getDv(D.id,bkk(now()).date)};renderDp();break;
    case 'dp-m':dp.month=addMonth(dp.month,Number(D.n));renderDp();break;
    case 'dp-today':var id0=dp.id;dp=null;renderDp();onDate(id0,bkk(now()).date);break;
    case 'dp-pick':var id1=dp.id;dp=null;renderDp();onDate(id1,D.d);break;
    case 'dp-close':dp=null;renderDp();break;
    case 'dp-bg':if(e.target===el){dp=null;renderDp();}break;
  }
});
document.addEventListener('submit',function(e){if(e.target.id==='loginForm'){e.preventDefault();doLogin();}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='lvReason')lv.reason=t.value;else if(t.id==='lvNote')lvNote=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='mode'){$('covRow').hidden=t.value!=='off';}
  else if(t.id==='fTeam'){
    $('fShift').innerHTML=shiftOptions(t.value,'');
    $('fShiftRow').hidden=t.value==='OPS';$('fOpsHint').hidden=t.value!=='OPS';
  }else if(t.id==='fRole'){
    var adm=t.value==='admin';
    $('fTeamRow').hidden=adm;$('fWorkRow').hidden=!adm;
    $('fShiftRow').hidden=adm||$('fTeam').value==='OPS';$('fOpsHint').hidden=adm||$('fTeam').value!=='OPS';
  }else if(t.id==='simTm'){
    if(t.value){clockOffset=Date.parse((dv.simD||bkk(now()).date)+'T'+t.value+':00+07:00')-Date.now();renderAll();}
  }else if(t.id==='rpTeam'||t.id==='rpEmp'){
    rep.team=$('rpTeam').value;rep.emp=$('rpEmp').value;rep.csv='';renderView();
  }else if(t.id==='csvFile'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){io.csv=String(fr.result||'');io.msg='';io.preview=checkCsv(io.csv);renderView();};
    fr.readAsText(t.files[0],'utf-8');
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(dp){dp=null;renderDp();}
  else if(modal){closeModal();}
  else if(bellOpen){bellOpen=false;renderChrome();}
});
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!document.documentElement.getAttribute('data-theme'))renderAll();});}catch(e){}}
var rzT=null;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){if(me&&view==='today'&&!dp&&!modal)renderView();},250);});

setInterval(function(){var c=$('clk');if(c&&me)c.textContent=bkk(now()).hms;tickModal();},1000);
setInterval(function(){
  if(!me||modal||dp)return;
  if(view==='home')renderView();
  else if(view==='today'&&!document.querySelector('details.tv[open]'))renderView();
},30000);

renderAll();
})();
</script>
