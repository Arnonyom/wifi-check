<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}.langopts{grid-template-columns:1fr 1fr}.langbtn{font-weight:700;font-size:13px;width:auto;min-width:40px;padding:0 10px}
</style>
<title>WiFi-Check</title>
<meta name="application-name" content="WiFi-Check">
<meta name="apple-mobile-web-app-title" content="WiFi-Check">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7AC143">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: sticky top bar (brand, theme, bell, user). Desktop: pill tabs under it. Phone: fixed bottom tab bar, confirm dialogs become bottom sheets. */
  --bg:#F3F8EE; --surface:#FFFFFF; --surface-2:#EBF3E4; --ink:#10281A; --muted:#58705F; --line:#D6E4CC;
  --brand:#7AC143; --brand-strong:#2E7D1A; --on-strong:#FFFFFF; --brand-soft:#E3F2D6; --on-brand:#10281A;
  --late:#7A4A00; --late-soft:#FFF0CF; --amber:#E0A100; --off:#A8322A; --off-soft:#FBE6E3; --hatch:#E8EFE2;
  --scrim:rgba(8,20,12,.55);
  --shadow:0 1px 2px rgba(16,40,26,.06),0 8px 24px rgba(16,40,26,.07);
  --font-display:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --font-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1710; --surface:#132119; --surface-2:#1A2C20; --ink:#E7F2E4; --muted:#93AB99; --line:#274030;
    --brand:#8FD65A; --brand-strong:#8FD65A; --on-strong:#0C1710; --brand-soft:#1E3624; --on-brand:#0C1710;
    --late:#F2C265; --late-soft:#3A2D10; --amber:#F2C265; --off:#F19A92; --off-soft:#3A1B18; --hatch:#182A1E;
    --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1710; --surface:#132119; --surface-2:#1A2C20; --ink:#E7F2E4; --muted:#93AB99; --line:#274030;
  --brand:#8FD65A; --brand-strong:#8FD65A; --on-strong:#0C1710; --brand-soft:#1E3624; --on-brand:#0C1710;
  --late:#F2C265; --late-soft:#3A2D10; --amber:#F2C265; --off:#F19A92; --off-soft:#3A1B18; --hatch:#182A1E;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.shell{max-width:1200px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:24px;font-weight:700} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-strong);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-display);font-size:18px;font-weight:700;display:block;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.user{display:flex;align-items:center;gap:8px;min-width:0}
.uname{line-height:1.25;min-width:0;font-size:14px}
.uname b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.uname span{color:var(--muted);font-size:13px;display:block}
.badge{position:absolute;top:-6px;right:-6px;background:var(--amber);color:#2b1c00;border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;font-weight:700;border:2px solid var(--bg)}
.bellwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(400px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:35;padding:8px}
.note{display:flex;gap:12px;padding:12px;border-radius:10px;width:100%;text-align:left;background:none;border:0;cursor:pointer;margin-bottom:4px}
.note:hover{background:var(--surface-2)}
.note.warn{background:var(--late-soft)}
.note b{font-family:var(--font-display);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand-strong);flex:none;margin-top:7px}
.dot.read{background:transparent;border:1px solid var(--line)}
.dot.amber{background:var(--amber);border:0}
.pre{white-space:pre-wrap;word-break:break-word;display:block}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--brand-strong);color:var(--on-strong);border-color:var(--brand-strong)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;margin-bottom:16px;font-size:14px}
.demo label{margin:0;display:inline}
.demo input{background:var(--surface);width:auto;min-height:36px;padding:4px 8px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.hero{box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:14px}

/* buttons, fields */
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--brand-strong);color:var(--on-strong);font-weight:600;cursor:pointer;font-family:var(--font-display);font-size:15px;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.danger{background:var(--off);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--off);font-size:14px;min-height:20px}
.ok{color:var(--brand-strong);font-size:14px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;background:var(--brand-soft);color:var(--ink);line-height:1.5}
.chip.off{background:var(--off-soft);color:var(--off)}
.chip.late{background:var(--late-soft);color:var(--late);box-shadow:inset 0 0 0 1px var(--amber)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.alert-y{background:var(--late-soft);color:var(--late);border:1px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:500;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--brand-strong);color:var(--on-strong)}

/* login */
.login-wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
.demo-acc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.acc{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer}
.acc:hover{background:var(--brand-soft)}

/* check-in */
.clock{font-family:var(--font-display);font-weight:600;font-size:clamp(40px,12vw,60px);letter-spacing:1px;line-height:1.1;text-align:center}
.ring{--p:0;--rw:min(340px,84vw);width:var(--rw);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:18px auto}
.ring button{width:calc(100% - 28px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:var(--brand-strong);color:var(--on-strong);font-family:var(--font-display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring button span{font-size:clamp(28px,calc(var(--rw)*.13),44px);font-weight:700}
.ring button small{font-size:clamp(14px,calc(var(--rw)*.055),19px);opacity:.85}
.ring button.out{background:var(--ink);color:var(--surface)}
.ring button:disabled{opacity:.4;cursor:not-allowed}
.center{text-align:center}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .when{font-weight:500}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sum div{background:var(--surface-2);border-radius:12px;padding:10px 16px}
.sum b{font-family:var(--font-display);font-size:26px;display:block;line-height:1.2}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}
thead th{background:var(--surface-2);font-family:var(--font-display);font-weight:600;font-size:14px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

/* schedule */
.wk{min-width:940px;table-layout:fixed}
.wk th,.wk td{padding:6px;text-align:center}
.wk th:first-child,.wk td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;width:116px;z-index:1;border-right:1px solid var(--line)}
.wk thead th:first-child{background:var(--surface-2)}
.wk th.today{background:var(--brand);color:var(--on-brand)}
.wk th small{display:block;font-weight:400;font-size:13px}
.cell{display:flex;flex-direction:column;gap:3px;align-items:flex-start;width:100%;min-height:64px;padding:8px;border-radius:10px;border:1px solid transparent;background:var(--brand-soft);text-align:left;font-size:14px;line-height:1.3}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--brand-strong)}
.cell .pn{font-family:var(--font-display);font-weight:500}
.cell.off{background:var(--off-soft);border-color:var(--off)}
.cell.off .pn{text-decoration:line-through;color:var(--muted)}
.cell .cov{color:var(--ink);font-weight:500}
.cell .tm{display:block;font-size:13px;line-height:1.4}
.cell .tm small{color:var(--muted);font-size:13px}
.cell.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted);align-items:center;justify-content:center}
.cell.me{box-shadow:inset 0 0 0 2px var(--brand-strong)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dchip small{color:var(--muted);font-size:12px;line-height:1.3}
.dchip b{font-family:var(--font-display);font-size:16px;line-height:1.3}
.dchip.on{background:var(--brand-strong);color:var(--on-strong);border-color:var(--brand-strong)}
.dchip.on small{color:inherit}
.dchip.off{opacity:.55}
.dchip.tod b{text-decoration:underline}
.dcard{display:flex;flex-direction:column;gap:6px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* dialog */
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal{width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;text-align:right}

@media (max-width:760px){
  .grid2,.login-wrap{grid-template-columns:minmax(0,1fr)}
  .tab svg{width:22px;height:22px}
}
@media (max-width:720px){
  .shell.in{padding-block:0 100px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:0;border-bottom:0;border-top:1px solid var(--line);background:var(--surface);overflow:visible;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tab{flex:1;flex-direction:column;gap:2px;border:0;background:none;border-radius:12px;padding:6px 2px;font-size:12px;min-width:0;white-space:normal;text-align:center;line-height:1.25}
  .tab[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
  .pop{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);width:auto}
  .overlay{place-items:end center;padding:0}
  .modal{width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .hide-s{display:none}
  h1{font-size:22px}
}
@media (max-width:480px){
  .topbar.in .brand small{display:none}
  .topbar.in .brand b{font-size:16px;white-space:nowrap}
  .topbar.in .mark{width:36px;height:36px;border-radius:11px}
  .topbar.in .iconbtn{width:36px;height:36px;border-radius:11px}
  .topbar.in .top-right{gap:6px}
  .uname span{display:none}
  .uname b{max-width:84px}
}
@media (max-width:400px){
  .topbar.in .uname{display:none}
  .topbar.in .iconbtn{width:34px;height:34px}
}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
}
/* ---- v4 additions: chart + status tokens (light), then dark below ---- */
:root{
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --st-good:#0ca30c; --st-warn:#fab219; --st-bad:#d03b3b;
  --grid:#DDE8D4; --axis:#B7CBAB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#274030; --axis:#3b5a45; }
}
:root[data-theme="dark"]{ --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#274030; --axis:#3b5a45; }

/* date field (opens calendar dialog) */
.dfield{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500;min-width:150px;width:100%}
.dfield:hover{background:var(--surface-2)}
.dfield svg{width:18px;height:18px;color:var(--muted);flex:none}
.demo .dfield{min-height:36px;padding:4px 10px;width:auto;min-width:0}
.row .dfield{width:auto}
#dpbox .overlay{z-index:50}
/* หน้าตั้งค่าระบบ: แท็บหมวด + ตารางการ์ด + หน้าต่าง popup */
.settabs{align-self:flex-start;max-width:100%;overflow-x:auto;flex-wrap:nowrap}
.settabs button{white-space:nowrap}
.settabs button[aria-selected="true"]{background:var(--brand-strong);color:var(--on-strong)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.stile{display:flex;align-items:center;gap:12px;padding:14px}
.stile[hidden]{display:none}
.stile .grow{min-width:0;display:flex;flex-direction:column;gap:2px}
.stile b{font-size:15px}
.stic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center}
section.spop:not(.open){display:none!important}
section.spop.open{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 32px));max-height:min(86vh,900px);overflow:auto;box-shadow:var(--shadow);padding-top:18px}
section.spop.open>h2{padding-right:44px}
.spx{position:absolute;top:10px;right:10px}
section.spop.open{position:fixed}
.spbg{display:none}.spbg.on{display:block;position:fixed;inset:0;z-index:41;background:var(--scrim,rgba(0,0,0,.45))}
body.noscroll{overflow:hidden}
@media (max-width:720px){section.spop.open{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:88vh;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
/* ฟันเฟือง: สวิตช์ภาษา */
.langsw{padding:6px 2px}.langsw .lsw{display:flex;align-items:center;gap:8px}.langsw .lsw>span[lang]{font-size:14px;color:var(--muted)}.langsw .lsw>span.on{color:var(--ink);font-weight:700}

/* วันหยุด + ล้างข้อมูล */
.cell.hol span{font-size:11px;line-height:1.25;text-align:center;color:var(--off);font-weight:600;padding:0 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hlist{max-height:380px;overflow:auto}
.hrow{flex-wrap:nowrap}.hrow .hd{min-width:96px;color:var(--muted)}.hrow.past{opacity:.55}
.clrk{display:flex;gap:10px;align-items:flex-start;margin:0;cursor:pointer}.clrk input{margin-top:4px}

/* ตำแหน่งตอนเข้า/ออกงาน */
.ioloc{margin:6px auto 0;max-width:100%;color:var(--muted);text-align:center;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ioloc .chip{font-size:12px;padding:1px 8px}
.ioloc b{font-weight:600;color:var(--ink)}
.maplink{white-space:nowrap;font-size:13px;color:var(--brand-strong);font-weight:600}
.locp{word-break:keep-all;overflow-wrap:break-word}
#mLoc{max-width:65%}

/* หน้าพนักงาน: รายชื่อในการ์ดทีม */
.pteam{padding:14px 14px 8px;max-width:760px}
.pteam h2{margin:0 0 6px}
.plist{display:flex;flex-direction:column;gap:0}
.plist .prow{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px;padding:0;border-bottom:1px solid var(--line);border-radius:10px;background:transparent}
.plist .prow:last-child{border-bottom:0}
.prhd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 6px;cursor:pointer;border-radius:10px}
.prhd:hover{background:var(--surface-2)}
.prhd:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.prnm{min-width:0;display:flex;flex-direction:column}
.prnm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prflag{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.prflag .chip{font-size:12px;padding:2px 8px}
.prhd .pmchev{color:var(--muted);transition:transform .15s}
.plist .prow.open{background:var(--surface-2);border-color:transparent;margin:4px 0}
.prow.open .pmchev{transform:rotate(90deg)}
.plist .prow .dragh{margin:0}
.prx{flex-basis:100%;display:flex;flex-direction:column;gap:10px;padding:2px 10px 12px 50px;animation:pmin .15s ease-out}
.plist .prow.dragging{background:var(--surface);border:1px solid var(--line)}
.plist .pcard-ph{border-radius:10px;margin:2px 0}
@media (max-width:480px){.prx{padding-left:10px}}
@media (prefers-reduced-motion:reduce){.prx{animation:none}.prhd .pmchev{transition:none}}

/* โปรไฟล์ */
.ubtn{all:unset;cursor:pointer;display:block;border-radius:8px;padding:2px 4px}
.ubtn:hover b{text-decoration:underline}
.ubtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.phd{display:flex;align-items:center;gap:14px}
.phd h2{margin:0}.phd p{margin:2px 0 0}
.pav{flex:none;width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:24px;font-family:var(--font-display)}
.pav.sm{width:34px;height:34px;font-size:15px}
.pmem{flex-wrap:nowrap}
.plang{display:flex;flex-direction:column;gap:8px}.plang p{margin:0}
/* โปรไฟล์เป็นการ์ดขนาดพอดี ไม่ยืดเต็มจอ (คอมและมือถือ) */
.profwrap{max-width:520px;width:100%;gap:12px}
.profwrap .card{padding:16px}
.profwrap h2{font-size:17px}
.profwrap .phd{gap:12px}
.profwrap .pav{width:46px;height:46px;font-size:19px}
.profwrap .pav.sm{width:30px;height:30px;font-size:13px}
.profwrap .kv div{padding:7px 0}
.profwrap .li{padding:8px 0}
/* มือถือ: การ์ดโปรไฟล์แคบลง อยู่กลางจอ */
@media (max-width:640px){.profwrap{width:max(80%,min(100%,300px));margin:0 auto}}
/* สมาชิกในทีม: กดแล้วขยาย */
.pmem{all:unset;box-sizing:border-box;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background .15s}
.pmem:hover{background:var(--surface-2)}
.pmem:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.pmem .pmchev{color:var(--muted);transition:transform .15s}
.pmem.open{background:var(--surface-2);border-color:transparent;margin:4px 0;padding:12px 10px}
.pmem.open .pmchev{transform:rotate(90deg)}
.pmem.open .pav.sm{width:44px;height:44px;font-size:18px}
.pmem.open b{font-size:16px}
.pmx{flex-basis:100%;display:flex;flex-direction:column;gap:6px;padding:8px 2px 2px;font-size:14px;animation:pmin .15s ease-out}
.pmrow{display:flex;justify-content:space-between;gap:10px}.pmrow b{font-size:14px!important;text-align:right}
@keyframes pmin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pmx{animation:none}.pmem,.pmem .pmchev{transition:none}}
/* เมนูฟันเฟือง: ออกจากระบบ (ถามยืนยันก่อน) */
.thout{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}.thout p{margin:0}
.thout .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}.thout .btn svg{width:18px;height:18px}

/* จัดลำดับการ์ดพนักงาน */
.pchd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dragh{flex:none;width:36px;height:36px;margin:-8px -8px 0 0;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:grab;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dragh:hover{background:var(--surface-2);color:var(--ink)}
.dragh:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.pgrid>.pcard:only-child .dragh{display:none}
.pcard.dragging{position:fixed;z-index:60;margin:0;box-shadow:0 14px 34px rgba(0,0,0,.35);transform:rotate(1.5deg);opacity:.96}
.pcard-ph{border:2px dashed var(--brand);border-radius:14px;background:var(--brand-soft);opacity:.5}
body.pdragging,body.pdragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
@media (max-width:720px){.dragh{width:44px;height:44px;margin:-12px -12px 0 0}}

/* ลงเวลาแทน */
#attEd .attcur span{min-width:120px}
#attEd .attmode{display:grid;grid-template-columns:repeat(3,1fr);width:100%}#attEd .attmode button{white-space:nowrap;padding-inline:6px}
#attEd .attmode button[disabled]{opacity:.45}
#attEd .attrow{gap:8px;flex-wrap:wrap;align-items:center}
#attEd .attrow input[type=time]{font-size:22px;font-family:var(--font-display);width:9.5em;min-height:48px;text-align:center}
#attEd .attprev{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}

/* mobile: sheet handle + check-in times */
@media (max-width:720px){.overlay .modal{position:relative;padding-top:26px}.overlay .modal::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.45;z-index:5;pointer-events:none}.overlay .modal .dhd{top:-26px;margin-top:-26px;padding-top:26px}}
.iotimes{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.iotimes span{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:6px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.iotimes span.iod{flex-basis:100%;background:none;border:0;padding:0}
.iotimes small{font-size:12.5px;color:var(--muted)}
.iotimes b{font-family:var(--font-display);font-size:20px;line-height:1.2}
.card.hero.tight .rules{display:none}.card.hero.tight .clock{font-size:clamp(32px,10vw,46px)}.card.hero.tight .ring{margin:10px auto}.card.hero.tight .iotimes{margin-top:4px}.card.hero.tight .iotimes span{padding:3px 10px}

/* slim: report sections + settings link */
.seg.rsec{align-self:flex-start;max-width:100%;overflow-x:auto}
.simgo{width:100%;text-align:left;border:0!important}

/* notification links */
.notego{display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--brand-strong)}
.toast.tgo{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.toast.tgo:hover{filter:brightness(.98);transform:translateY(-1px)}

/* table header with Excel */
.tblhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tblhead h3{margin:0}
.xlbtn{display:inline-flex;align-items:center;gap:6px;background:#1D6F42;border-color:#1D6F42;color:#fff}
.xlbtn:hover{filter:brightness(1.08)}

/* admin editor */
.fgbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;min-width:60px;flex:1}
.fgbar i{display:block;height:100%}
.fgbar .a{background:var(--st-warn)}.fgbar .m{background:var(--st-bad)}
.fgrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,2fr) minmax(0,15em);gap:12px;align-items:center}
@media (max-width:720px){.fgrow{grid-template-columns:1fr;gap:6px}.fgrow .row{justify-content:flex-start!important}}
.edmodes{gap:8px;flex-wrap:wrap}
.radchip{display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface)}
.radchip.on{border-color:var(--brand-strong);background:var(--brand-soft);font-weight:600}
.radchip input{accent-color:var(--brand-strong)}
/* theme picker */
.thwrap{position:relative}
.thpop{width:min(300px,calc(100vw - 32px));padding:14px;display:flex;flex-direction:column;gap:10px}
.thopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:13px}
.thopt.on{border-color:var(--brand-strong);box-shadow:0 0 0 2px var(--brand-strong) inset;font-weight:600}
.thsw{width:36px;height:24px;border-radius:8px;border:1px solid rgba(0,0,0,.12);display:block}
.thsw-light{background:#F3F8EE}.thsw-dark{background:#0C1710}
.thsw-glass{background:linear-gradient(135deg,#a8e063 0%,#56c2b5 45%,#8e8cf0 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
#glassRange{width:100%;accent-color:var(--brand-strong)}
/* liquid glass */
:root[data-theme="glass"]{
  --bg:transparent;
  --surface:rgba(255,255,255,var(--ga,.5));
  --surface-2:rgba(255,255,255,calc(var(--ga,.5) * .6));
  --ink:#0D2315; --muted:#38533F; --line:rgba(255,255,255,.7);
  --brand:#7AC143; --brand-strong:#1F6A0E; --on-strong:#FFFFFF; --brand-soft:rgba(122,193,67,.28); --on-brand:#0D2315;
  --late:#5E3A00; --late-soft:rgba(255,226,150,.6); --amber:#D99A00; --off:#8E241D; --off-soft:rgba(255,205,198,.6); --hatch:rgba(255,255,255,.3);
  --scrim:rgba(8,28,18,.35);
  --shadow:0 10px 30px rgba(16,60,36,.16),inset 0 1px 0 rgba(255,255,255,.75);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:rgba(255,255,255,.55); --axis:rgba(30,70,45,.35);
  color-scheme:light;
}
:root[data-theme="glass"] body{background:#d6eedd;background-image:radial-gradient(60vw 50vw at 8% 10%,rgba(141,214,90,.85),transparent 60%),radial-gradient(55vw 45vw at 92% 18%,rgba(72,190,180,.75),transparent 60%),radial-gradient(60vw 55vw at 75% 95%,rgba(140,130,240,.6),transparent 60%),radial-gradient(50vw 45vw at 15% 90%,rgba(255,206,120,.55),transparent 60%);background-attachment:fixed}
:root[data-theme="glass"] body::before{background:transparent}
:root[data-theme="glass"] .card,:root[data-theme="glass"] .modal,:root[data-theme="glass"] .iconbtn,:root[data-theme="glass"] .tab,:root[data-theme="glass"] .pop,:root[data-theme="glass"] .toast,:root[data-theme="glass"] .seg,:root[data-theme="glass"] .cell,:root[data-theme="glass"] .thopt,:root[data-theme="glass"] .radchip,:root[data-theme="glass"] input,:root[data-theme="glass"] select,:root[data-theme="glass"] textarea,:root[data-theme="glass"] .btn.sec{-webkit-backdrop-filter:blur(var(--gb,18px)) saturate(170%);backdrop-filter:blur(var(--gb,18px)) saturate(170%)}
:root[data-theme="glass"] .card,:root[data-theme="glass"] .modal,:root[data-theme="glass"] .pop{box-shadow:var(--shadow)}
:root[data-theme="glass"] .modal,:root[data-theme="glass"] .pop,:root[data-theme="glass"] .toast{background:linear-gradient(140deg,rgba(255,255,255,calc(var(--gp,.6) + .1)) 0%,rgba(255,255,255,var(--gp,.6)) 55%,rgba(255,255,255,calc(var(--gp,.6) * .85)) 100%);-webkit-backdrop-filter:blur(calc(var(--gb,18px) + 14px)) saturate(185%);backdrop-filter:blur(calc(var(--gb,18px) + 14px)) saturate(185%);border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 60px rgba(16,60,36,.22),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35)}
:root[data-theme="glass"] .toast{border-left:4px solid var(--brand-strong)}
:root[data-theme="glass"] .overlay{background:rgba(18,48,32,.16)}
:root[data-theme="glass"] .dhd{background:rgba(255,255,255,calc(var(--gp,.6) * .6 + .35))}
:root[data-theme="glass"] .topbar{background:rgba(255,255,255,calc(var(--ga,.5) * .5 + .4));margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
:root[data-theme="glass"] input,:root[data-theme="glass"] select,:root[data-theme="glass"] textarea{background:rgba(255,255,255,calc(var(--ga,.5) * .8 + .15))}
@media (max-width:720px){:root[data-theme="glass"] .tabs{background:rgba(255,255,255,calc(var(--ga,.5) * .7 + .1));-webkit-backdrop-filter:blur(var(--gb,18px)) saturate(170%);backdrop-filter:blur(var(--gb,18px)) saturate(170%)}}

.cell.flexc{border-style:dashed;align-items:center;justify-content:center;opacity:.85}

/* simulator */
.simbanner{margin:0;padding:10px 14px;border-radius:10px;background:var(--late-soft);color:var(--late);border:1px dashed var(--amber);font-size:14px}
.simchips{gap:6px;flex-wrap:wrap}
.simlog{min-width:620px}
.simoff{opacity:.65}
.simres{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.simres p{margin:0}
.simres.ok{background:var(--st-good);color:#fff}
.simres.warn{background:var(--st-warn);color:#2b2100}
.simres.bad{background:var(--st-bad);color:#fff}
.tl{position:relative;height:18px;border-radius:9px;overflow:visible;background:var(--surface-2);margin:26px 0 4px}
.tl>span{position:absolute;top:0;bottom:0}
.tl-pre{background:var(--grid);border-radius:9px 0 0 9px}
.tl-open{background:var(--st-good)}
.tl-late{background:var(--st-warn)}
.tl-end{background:var(--st-bad);border-radius:0 9px 9px 0}
.tl-mk{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px;font-style:normal}
.tl-mk em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-style:normal;background:var(--ink);color:var(--surface);padding:1px 6px;border-radius:6px;margin-bottom:2px}
.tl-mk.out em{bottom:auto;top:100%;margin:2px 0 0}
.tl-lab{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px}
.tl-lab span{display:inline-flex;align-items:center;gap:6px}
.tl-k{width:12px;height:12px;border-radius:3px;display:inline-block}
.tl-k.pre{background:var(--grid)}.tl-k.open{background:var(--st-good)}.tl-k.late{background:var(--st-warn)}.tl-k.end{background:var(--st-bad)}

/* password */
.pwrow{display:flex;gap:6px;align-items:center}
.pwrow input{flex:1;min-width:0}
.pweye{width:44px;height:44px;font-size:16px}
.pwchk{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.pwchk li::before{content:'○ ';}
.pwchk li.on{color:var(--brand-strong)}
.pwchk li.on::before{content:'✓ ';font-weight:700}
.pwbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pwbar i{display:block;height:100%;width:0;background:var(--st-bad);transition:width .2s}
.pwbar i.s2{background:var(--st-warn)}.pwbar i.s3,.pwbar i.s4,.pwbar i.s5{background:var(--st-good)}
#pwbox .overlay{z-index:46}
#pwForm{gap:10px}

/* drill-down */
.cardh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.xbtn{flex:none;min-height:32px;padding:4px 10px}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative}
.kpi.go::after{content:'›';position:absolute;right:12px;top:8px;color:var(--muted);font-size:20px;line-height:1}
.kpi.go:hover,.pcard[data-act]:hover{border-color:var(--brand-strong)}
.pcard[data-act]{cursor:pointer}
.hit[data-act]{cursor:pointer}
.chart [data-act]:not(.hit){cursor:pointer}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface-2)}
.lib{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer;padding:10px 6px;border-radius:0}
.lib:hover{background:var(--surface-2)}
.lib .go{color:var(--muted);font-size:20px;line-height:1;flex:none}
[data-act="det"]:focus-visible{outline:2px solid var(--brand-strong);outline-offset:2px}
#detbox .overlay{z-index:45}
.detm{width:min(860px,100%);gap:10px}
.detm:focus{outline:none}
.dhd{display:flex;align-items:flex-start;gap:10px;position:sticky;top:-20px;margin-top:-20px;padding-top:20px;padding-bottom:8px;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.dhd h2{margin:0}
.dbody{display:flex;flex-direction:column;gap:12px;min-width:0}
.dbody h3{margin:6px 0 0}
.dft{gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.hint{margin:0}
.lib>.grow{flex:1 1 200px}
.lib>.row{flex:0 1 auto;flex-wrap:wrap}
.dcard .seg button{white-space:nowrap;padding:8px 12px}
.calnav .btn{white-space:nowrap}
@media (max-width:720px){.calnav{flex-wrap:wrap}.calnav .dfield{flex:1 1 160px}.lib>.row{justify-content:flex-start!important}}
.dc.nodata,.ym.nodata,.sb.nodata{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,var(--surface-2) 4px 8px);color:var(--muted)}
.cd.nodata{background:var(--surface-2);color:var(--muted)}
.dsum i.nd{background:repeating-linear-gradient(135deg,var(--axis) 0 2px,var(--surface-2) 2px 4px)}
.dcx{min-height:0}
.smat{min-width:820px}
.smat td{padding:4px}
.sb{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:58px;border:0;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;line-height:1.3;text-align:left;min-width:0}
.sb b{font-family:var(--font-display);font-weight:600;font-size:14px}
.sb small{font-size:12px;opacity:.9}
button.sb{cursor:pointer}
button.sb:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.sb.ok{background:var(--st-good);color:#fff}.sb.warn{background:var(--st-warn);color:#2b2100}.sb.bad{background:var(--st-bad);color:#fff}
.sb.open{background:var(--grid);color:var(--ink)}.sb.future,.sb.none{background:var(--surface-2);color:var(--muted)}
.sb.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted);align-items:center;justify-content:center}
.dchip.dst{position:relative}
.dchip.dst i{font-style:normal;font-weight:700;font-size:12px;line-height:1}
.dchip.dst.ok i{color:var(--st-good)}.dchip.dst.warn i{color:#b07800}.dchip.dst.bad i{color:var(--st-bad)}
.dchip.dst.on i{color:inherit}
.dchip:disabled{opacity:.4;cursor:not-allowed}
.dban{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-radius:12px;padding:12px 14px;font-size:15px}
.dban.ok{background:var(--st-good);color:#fff}.dban.warn{background:var(--st-warn);color:#2b2100}.dban.bad{background:var(--st-bad);color:#fff}
.dban.open,.dban.future,.dban.none,.dban.nodata{background:var(--surface-2);color:var(--muted)}
.dcard .ygrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:6px;border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer;text-align:left}
.mhead:hover b{text-decoration:underline}
.yd{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 2px 0 4px}
.yd.ok{background:var(--st-good)}.yd.warn{background:var(--st-warn)}.yd.bad{background:var(--st-bad)}
.ym{border:0;border-radius:4px;font:inherit;font-size:11px;line-height:1;padding:4px 0;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
button.ym{cursor:pointer}
button.ym:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.ym.ok{background:var(--st-good);color:#fff}.ym.warn{background:var(--st-warn);color:#2b2100}.ym.bad{background:var(--st-bad);color:#fff}
.ym.open{background:var(--grid)}.ym.future,.ym.none{background:transparent;color:var(--muted)}
.ym.tod{box-shadow:inset 0 0 0 2px var(--brand-strong)}
.calnav{gap:6px;flex-wrap:nowrap}
.calnav select{width:auto;min-height:36px;padding:4px 8px}
.calnav .btn{min-height:36px}
.dsums{gap:6px;flex-wrap:wrap}
.dsum{display:inline-flex;align-items:center;gap:6px;border:0;font:inherit;font-size:13px;cursor:pointer;background:var(--surface-2);color:var(--ink)}
.dsum i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dsum.ok i{background:var(--st-good)} .dsum.warn i{background:var(--st-warn)} .dsum.bad i{background:var(--st-bad)} .dsum i.op{background:var(--grid)}
span.dsum{cursor:default}
.dcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dcal.hd span{text-align:center;color:var(--muted);font-size:13px}
.dc{min-height:72px;border:0;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;font-variant-numeric:tabular-nums;min-width:0;position:relative}
.dc b{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.2}
.dc .g{position:absolute;right:8px;top:6px;font-weight:700;font-size:15px;line-height:1}
.dc .nt{font-size:12px;line-height:1.3;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
button.dc{cursor:pointer}
button.dc:hover{filter:brightness(1.06);box-shadow:inset 0 0 0 2px var(--ink)}
.dc.ok{background:var(--st-good);color:#fff}
.dc.warn{background:var(--st-warn);color:#2b2100}
.dc.bad{background:var(--st-bad);color:#fff}
.dc.open{background:var(--grid);color:var(--ink)}
.dc.future{background:var(--surface-2);color:var(--muted)}
.dc.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted)}
.dc.tod{box-shadow:inset 0 0 0 2px var(--brand-strong)}
@media (max-width:720px){.dc{min-height:48px;padding:4px 5px}.dc .nt{display:none}.dc b{font-size:14px}.dc .g{right:5px;top:4px;font-size:12px}.dcal{gap:4px}.cardh{flex-wrap:wrap}}
@media (max-width:720px){.hint{display:none}.detm{max-height:92vh}}

.dpm{width:min(360px,100%)}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dgrid.dh span{text-align:center;color:var(--muted);font-size:13px}
.dday{aspect-ratio:1;border:0;background:none;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:15px;min-height:36px}
.dday:hover{background:var(--surface-2)}
.dday.on{background:var(--brand-strong);color:var(--on-strong)}
.dday.tod{box-shadow:inset 0 0 0 2px var(--brand-strong)}

/* tab badge, switches, toast, tooltip */
.tab{position:relative}
.count{background:var(--amber);color:#2b1c00;border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-weight:700}
.swrow{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;padding:6px 12px;background:none;border:0;cursor:pointer;text-align:left;border-radius:10px;min-height:44px;font-size:15px}
.swrow:hover{background:var(--surface-2)}
.sw{width:44px;height:26px;border-radius:999px;background:var(--axis);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--brand-strong)}
.sw.on i{transform:translateX(18px)}
.pref{border-bottom:1px solid var(--line);margin-bottom:6px;padding-bottom:6px}
#toast{position:fixed;z-index:55;top:calc(env(safe-area-inset-top,0px) + 66px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand-strong);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;font-size:14px}
.toast.warn{border-left-color:var(--amber);background:var(--late-soft)}
.toast b{font-family:var(--font-display);font-weight:600}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;max-width:240px;line-height:1.4}
.tip .tt{color:var(--muted);margin-bottom:3px}
.tip .tr{display:flex;align-items:center;gap:6px}
.tip i{width:10px;height:3px;border-radius:2px;flex:none}
.tip b{font-variant-numeric:tabular-nums}

/* charts */
svg.chart{display:block;max-width:100%;height:auto}
.t{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.tn{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:var(--ink);fill-opacity:.07}
.bar:hover{filter:brightness(1.12)}
.f-good{fill:var(--st-good)} .f-warn{fill:var(--st-warn)} .f-bad{fill:var(--st-bad)}
.f-s1{fill:var(--s1)} .f-s2{fill:var(--s2)} .f-s3{fill:var(--s3)}
.f-line{fill:var(--grid)} .f-hatch{fill:var(--hatch)} .f-surface{fill:var(--surface)}
.k-s1{stroke:var(--s1)} .k-s2{stroke:var(--s2)} .k-s3{stroke:var(--s3)} .k-surface{stroke:var(--surface)} .k-ink{stroke:var(--ink)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill-opacity:.10}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 2px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{overflow-x:auto;margin-top:6px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
.chartcard{display:flex;flex-direction:column}
details.tv{margin-top:8px;font-size:14px}
details.tv summary{cursor:pointer;color:var(--muted)}
details.tv .scroll{max-height:240px;overflow:auto;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--font-display);font-size:26px;line-height:1.2}
.kpi.heroK{grid-column:span 2}
.heroN{font-family:var(--font-display);font-size:56px;font-weight:700;line-height:1.1}
.kpi.heroK b.heroN{font-size:56px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}

/* month / year schedule */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid.hd span{text-align:center;color:var(--muted);font-size:13px;padding:2px 0}
.mday{min-height:84px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.mday b{font-family:var(--font-display);font-size:14px;font-weight:600}
.mday.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted)}
.mday.tod b{color:var(--brand-strong);text-decoration:underline}
.mday.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.mls{display:flex;flex-direction:column;gap:1px;min-width:0}
.ml{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ml i{width:8px;height:8px;border-radius:50%;background:var(--brand-strong);flex:none}
.ml.off i{background:var(--off)}
.ml.off{color:var(--off)}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mini{padding:12px;display:flex;flex-direction:column;gap:6px}
.mm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mm.hd span{text-align:center;color:var(--muted);font-size:11px}
.md{aspect-ratio:1;border:0;border-radius:4px;font-size:11px;background:var(--brand-soft);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;min-height:0;font-variant-numeric:tabular-nums}
.md.off{background:var(--off);color:#fff}
.md.na{background:var(--hatch);color:var(--muted)}
.md.tod{box-shadow:0 0 0 2px var(--ink)}
.rt{min-width:560px}
.rt th:first-child,.rt td:first-child{width:120px}
.rt .rowhead{font-weight:600;white-space:nowrap}
.rt .rowhead.today{color:var(--brand-strong)}

/* report calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal.hd span{text-align:center;color:var(--muted);font-size:13px}
.cd{min-height:58px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;background:var(--surface);text-align:left;font-variant-numeric:tabular-nums;min-width:0}
.cd b{font-family:var(--font-display);font-size:14px;font-weight:600}
.cd .g{font-weight:700;font-size:15px;line-height:1}
.cd.ok{background:color-mix(in srgb,var(--st-good) 24%,var(--surface));border-color:var(--st-good)}
.cd.warn{background:color-mix(in srgb,var(--st-warn) 30%,var(--surface));border-color:var(--st-warn)}
.cd.bad{background:color-mix(in srgb,var(--st-bad) 24%,var(--surface));border-color:var(--st-bad)}
.cd.open,.cd.future{background:var(--surface-2);color:var(--muted)}
.cd.none{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.cd.sel{outline:3px solid var(--ink);outline-offset:1px}
.cd.today b{text-decoration:underline}
.strike{text-decoration:line-through;color:var(--muted)}

/* leave */
.lvcard{display:flex;flex-direction:column;gap:8px}
.typeseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typeseg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:500;min-height:44px}
.typeseg button[aria-pressed="true"]{background:var(--brand-strong);color:var(--on-strong);border-color:var(--brand-strong)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bal div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.bal b{font-family:var(--font-display);font-size:22px;display:block;line-height:1.2}

@media (max-width:900px){
  .cgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .mday{min-height:58px;padding:4px}
  .mls{flex-direction:row;flex-wrap:wrap;gap:3px}
  .ml .nm{display:none}
  .ml i{width:9px;height:9px}
  #toast{left:max(16px,env(safe-area-inset-left,0px));width:auto}
  .tab .count{position:absolute;top:0;right:calc(50% - 26px);min-width:18px;height:18px;font-size:11px}
  .kpi.heroK{grid-column:1/-1}
  .cd{min-height:50px;padding:4px}
}

function busyIn(empId,a,b,skipKey,d){

function inInfo(stts,t){
  var L=ST().lateAfter,d=Math.trunc((t-stts)/60000);

  if(d>0)return {flag:false,late:d,cls:'',label:_tx('ตรงเวลา'),detail:_tx('เข้างานหลังเริ่มกะ ')+d+_tx(' นาที ยังอยู่ในเวลาผ่อนผัน (')+L+_tx(' นาที)')};
  if(d<0)return {flag:false,late:0,cls:'',label:_tx('ตรงเวลา'),detail:_tx('เข้างานก่อนเริ่มกะ ')+(-d)+_tx(' นาที')};

}
function outInfo(en,t){
  var d=Math.trunc((en-t)/60000);
  if(d>0)return {flag:true,early:d,cls:'late',label:_tx('ออกก่อน ')+d+_tx(' นาที'),detail:_tx('ออกงานก่อนเวลาเลิกกะ ')+d+_tx(' นาที')};

/* check-in card + my shifts (staff, Ops, and admins who can work) */
function myStatus(){
  var t=now(),today=bkk(t).date,O=ST().openBefore*60000;
  var open=state.attendance.find(function(a){return a.emp===me.id&&!a.out&&endTs(a.date,shiftById(a.shift))+12*3600000>t;});
  if(open){var s=shiftById(open.shift);return {mode:'out',rec:open,shift:s,st:startTs(open.date,s),en:endTs(open.date,s),isCover:open.cover};}
  var cand=null,next=null;
  for(var i=-1;i<=14;i++){
    var d=addDays(today,i);
    for(var j=0;j<SHIFTS.length;j++){
      var s2=SHIFTS[j],sl=slot(d,s2);
      if(!sl||!sl.working||sl.working.id!==me.id)continue;
      if(state.attendance.some(function(a){return a.emp===me.id&&a.date===d&&a.shift===s2.id;}))continue;
      var st=startTs(d,s2),en=endTs(d,s2),c={date:d,shift:s2,st:st,en:en,isCover:sl.off};
      if(t>=st-O&&t<=en){if(!cand||st<cand.st)cand=c;}
      else if(en>t&&(!next||st<next.st))next=c;
    }
  }
  if(cand){cand.mode='in';return cand;}
  return {mode:next?'wait':'none',next:next};
}
function myUpcoming(){
  var today=bkk(now()).date,rows=[];
  for(var i=0;i<7;i++){
    var d=addDays(today,i);
    SHIFTS.forEach(function(s){
      var sl=slot(d,s);if(!sl)return;
      if(sl.working&&sl.working.id===me.id)rows.push({d:d,s:s,kind:sl.off?'cover':'own',other:sl.regular});
      else if(sl.off&&sl.regular&&sl.regular.id===me.id)rows.push({d:d,s:s,kind:'off',other:sl.cover});
    });
  }
  return rows;
}

function fitRing(){
  var ring=document.querySelector('#main .ring'),card=ring&&ring.closest('.card');if(!ring||!card)return;
  card.classList.toggle('tight',ringTight);
  var nav=$('nav'),nr=nav&&!nav.hidden?nav.getBoundingClientRect():null;
  var bottom=nr&&nr.top>innerHeight/2?nr.top:innerHeight;
  var maxW=Math.min(340,document.documentElement.clientWidth*0.84);
  var cr=card.getBoundingClientRect(),rw=ring.getBoundingClientRect().width;
  var top=cr.top+(window.scrollY||0),other=cr.height-rw,room=bottom-top-other-12;
  /* จอเล็กมาก/ตัวอักษรใหญ่: ซ่อนบรรทัดกฎเวลา ลดขนาดนาฬิกา (ค้างไว้จนกว่าจะหมุนจอ/เปลี่ยนขนาดจอ) */
  if(!ringTight&&room<200){ringTight=true;card.classList.add('tight');requestAnimationFrame(fitRing);return;}
  var want=Math.floor(Math.max(ringTight?150:170,Math.min(maxW,room)));

  if(window.ResizeObserver&&(!ringRO||ringRO.card!==card)){

}

   1) เปิดหน้าต่างยืนยันเข้า/ออกงาน → ขอพิกัดจากเครื่อง (navigator.geolocation)
   2) แปลงพิกัดเป็นชื่อสถานที่ด้วย OpenStreetMap (Nominatim, ภาษาไทย)
   3) กดยืนยันสำเร็จ → บันทึกผ่าน set_my_location (ตาราง attendance_locations: เห็นได้เฉพาะเจ้าตัวและผู้ดูแล)

   (หน้าตัวอย่างใช้ window.__geoMock แทนเครื่องจริง) */
var geo=null;
function geoPlaceOf(a){
  if(!a)return null;
  var parts=[a.amenity||a.building||a.shop||a.office||a.tourism,a.road,a.suburb||a.quarter||a.neighbourhood||a.village,a.city_district||a.district||a.county||a.town||a.municipality,a.city||a.state||a.province],out=[];
  parts.forEach(function(v){if(v&&out.indexOf(v)<0)out.push(v);});
  return out.length?out.join(', ').slice(0,200):null;
}
function geoReverse(lat,lng){
  var M=window.__geoMock;if(M&&M.place!==undefined)return new Promise(function(r){setTimeout(function(){r(M.place);},150);});
  var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},7000);
  return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=th&lat='+lat.toFixed(6)+'&lon='+lng.toFixed(6),ctl?{signal:ctl.signal}:{})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){clearTimeout(tm);if(!j)return null;return geoPlaceOf(j.address)||((j.display_name||'').split(',').slice(0,3).join(',').trim()||null);})
    .catch(function(){clearTimeout(tm);return null;});
}
function geoStart(){
  var g={status:'wait',lat:null,lng:null,acc:null,place:null,placeWait:false};geo=g;
  g.p=new Promise(function(res){
    var M=window.__geoMock,nav=M&&M.geo?M.geo:(navigator.geolocation||null);
    if(!nav){g.status='unsupported';geoPaint();res(g);return;}
    try{
      nav.getCurrentPosition(function(pos){
        if(geo!==g){res(g);return;}
        g.status='ok';g.lat=pos.coords.latitude;g.lng=pos.coords.longitude;g.acc=Math.round(pos.coords.accuracy||0);g.placeWait=true;geoPaint();
        geoReverse(g.lat,g.lng).then(function(pl){g.place=pl;g.placeWait=false;geoPaint();res(g);});
      },function(err){g.status=err&&err.code===1?'denied':(err&&err.code===3?'timeout':'unavailable');geoPaint();res(g);},
      {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    }catch(e){g.status='unavailable';geoPaint();res(g);}
  });
  return g;
}
function geoCoords(L){return L.lat.toFixed(5)+', '+L.lng.toFixed(5);}

    '<div class="sum"><div><b>'+recs.length+_tx('</b><span class="muted small">วันที่ทำงาน</span></div><div><b>')+lateN+_tx('</b><span class="muted small">สาย</span></div><div><b>')+earlyN+_tx('</b><span class="muted small">ออกก่อน</span></div><div><b class="tnum">')+(ms/3600000).toFixed(1)+_tx('</b><span class="muted small">ชั่วโมงรวม</span></div></div>')+

/* ---------- slot analysis (shared by dashboard + report) ---------- */
function attIdx(){var m={};state.attendance.forEach(function(a){m[a.emp+'|'+a.date+'|'+a.shift]=a;});return m;}
function slotInfo(d,s,idx,t){
  var sl=slot(d,s);if(!sl)return null;
  var w=sl.working,rec=w?(idx[w.id+'|'+d+'|'+s.id]||null):null,st=startTs(d,s),en=endTs(d,s),L=ST().lateAfter*60000,k;
  if(!w)k='vacant';
  else if(rec)k=!rec.out?(t<en?'working':'incomplete'):((rec.lateFlag||rec.earlyFlag)?'late':'ok');
  else if(t<st)k='future';
  else if(t<=st+L)k='waiting';
  else if(t<en)k='noshow';
  else k='missing';
  return {d:d,s:s,sl:sl,w:w,rec:rec,k:k,st:st,en:en};
}
function dayStatus(d,idx,t){
  if(d<dataStart())return {d:d,rows:[],bad:0,warn:0,ok:0,state:'nodata'};
  var rows=[],bad=0,warn=0,okN=0,close=Date.parse(addDays(d,1)+'T00:00:00+07:00');
  SHIFTS.forEach(function(s){
    var r=slotInfo(d,s,idx,t);if(!r||!r.w)return;
    rows.push(r);if(r.en>close)close=r.en;
    if(r.k==='missing'||r.k==='incomplete')bad++;else if(r.k==='late')warn++;else if(r.k==='ok')okN++;
  });
  var closed=t>=close,st=!rows.length?'none':!closed?(d>bkk(t).date?'future':'open'):(bad?'bad':warn?'warn':'ok');
  return {d:d,rows:rows,bad:bad,warn:warn,ok:okN,state:st};
}
function kChip(r){
  var a=r.rec;
  switch(r.k){
    case 'ok':return _tx('<span class="chip">ตรงเวลา</span>');
    case 'late':return chipsFor(a);
    case 'working':return chipsFor(a)+_tx(' <span class="chip">ทำงานอยู่</span>');
    case 'incomplete':return chipsFor(a)+_tx(' <span class="chip off">ลืมออกงาน</span>');
    case 'missing':return _tx('<span class="chip off">ไม่มีบันทึก</span>');
    case 'noshow':return _tx('<span class="chip late">ยังไม่เข้างาน</span>');
    case 'waiting':return _tx('<span class="chip mute">รอเข้างาน</span>');
    case 'future':return _tx('<span class="chip mute">ยังไม่ถึงเวลา</span>');
    default:return _tx('<span class="chip mute">ไม่มีผู้ทำงาน</span>');
  }
}
var DSTATE={ok:[_tx('ปกติ'),'✓'],warn:[_tx('ไม่ปกติ (มีสายหรือออกก่อน)'),'!'],bad:[_tx('ผิดปกติ (ลงเวลาไม่ครบ)'),'✕'],open:[_tx('ยังไม่จบวัน'),''],future:[_tx('ยังไม่ถึงวัน'),''],none:[_tx('ไม่มีกะ'),''],nodata:[_tx('ไม่มีข้อมูล (ก่อนเริ่มใช้ระบบ)'),'']};

/* ---------- chart helpers ---------- */
function niceMax(v){if(v<=5)return Math.max(1,Math.ceil(v));var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;}

  rows.forEach(function(r,i){

  });

/* ---------- dashboard data ---------- */
function dashData(N){
  var t=now(),today=bkk(t).date,idx=attIdx();
  var daysArr=[],per={},sh={},tm={A:{ok:0,n:0,hrs:0},B:{ok:0,n:0,hrs:0}},dow=[0,0,0,0,0,0,0],hist=[0,0,0,0,0,0],cover={},leave={vac:0,per:0,sick:0};
  var tot={ok:0,late:0,early:0,miss:0,hours:0,fin:0,cover:0};
  for(var i=N-1;i>=0;i--){
    var d=addDays(today,-i),ds=dayStatus(d,idx,t),c={d:d,ok:0,late:0,miss:0,hA:0,hB:0,st:ds.state};
    ds.rows.forEach(function(r){
      if(['ok','late','missing','incomplete'].indexOf(r.k)<0)return;
      var w=r.w,p=per[w.id]||(per[w.id]={id:w.id,name:w.name,fin:0,ok:0,late:0,early:0,miss:0,hrs:0,sumOff:0,nOff:0}),T=tm[r.s.team];
      tot.fin++;p.fin++;T.n++;
      if(r.sl.off){tot.cover++;cover[w.id]=(cover[w.id]||0)+1;if(leave[r.sl.kind]!=null)leave[r.sl.kind]++;}
      if(r.rec){
        var a=r.rec,off=Math.trunc((a.in-r.st)/60000);
        p.sumOff+=off;p.nOff++;
        var z=sh[r.s.id]||(sh[r.s.id]={sum:0,n:0,late:0});z.sum+=off;z.n++;
        hist[off<-15?0:off<0?1:off<15?2:off<=30?3:off<=60?4:5]++;
        if(a.lateFlag){tot.late++;c.late++;p.late++;z.late++;dow[(dowOf(d)+6)%7]++;}else{tot.ok++;c.ok++;p.ok++;T.ok++;}
        if(a.out){var hrs=(a.out-a.in)/3600000;p.hrs+=hrs;tot.hours+=hrs;if(r.s.team==='A')c.hA+=hrs;else c.hB+=hrs;T.hrs+=hrs;if(a.earlyFlag){tot.early++;p.early++;}}
      }
      if(r.k==='missing'||r.k==='incomplete'){tot.miss++;c.miss++;p.miss++;if(!r.rec){}}
    });
    daysArr.push(c);
  }
  return {t:t,today:today,idx:idx,daysArr:daysArr,per:Object.keys(per).map(function(k){return per[k];}),sh:sh,tm:tm,dow:dow,hist:hist,cover:cover,leave:leave,tot:tot};
}
function pct(a,b){return b?Math.round(100*a/b):0;}

/* ---------- live board (today) ---------- */
function liveBoard(t,today,idx){
  var yest=addDays(today,-1),cards=[],working=0,waiting=0,late=0,offN=0;
  [yest,today].forEach(function(d){
    SHIFTS.forEach(function(s){
      var r=slotInfo(d,s,idx,t);if(!r)return;
      if(d===yest&&(!crosses(s)||r.en<=t))return;
      if(r.sl.off&&d===today)offN++;
      if(r.k==='working')working++;
      if(r.k==='waiting'||r.k==='future')waiting++;
      if(r.k==='noshow'||(r.rec&&r.rec.lateFlag))late++;
      var who=r.w?'<b>'+esc(r.w.name)+'</b>'+(r.sl.off?_tx(' <span class="chip">ทำแทน ')+esc(fn(r.sl.regular))+'</span>'+tagFor(r.w):''):'<span class="muted">—</span>';
      cards.push('<article class="card pcard"'+dk('slot:'+d+'|'+s.id)+'><div class="row between"><b class="tnum">'+(d===yest?_tx('<span class="muted small">เมื่อวาน </span>'):'')+shiftLabel(s)+'</b><span class="muted small">'+TEAMS[s.team].name+'</span></div><div>'+who+'</div><div class="row" style="gap:6px">'+kChip(r)+(r.rec?_tx('<span class="muted small tnum">เข้า ')+fmtHM(r.rec.in)+'</span>':'')+'</div></article>');
    });
  });
  return {cards:cards,working:working,waiting:waiting,late:late,off:offN};

var pwm=null,lastPw='';
var PW_RULE=_tx('อย่างน้อย 8 ตัว ใช้ได้ทั้งตัวอักษรภาษาอังกฤษตัวเล็ก ตัวใหญ่ ตัวเลข และอักขระพิเศษ เช่น ! @ # $ % _ - (ห้ามมีช่องว่างหรือภาษาไทย)');
function pwProblems(p){
  var out=[];
  if(p.length<8)out.push(_tx('ยาวอย่างน้อย 8 ตัว (ตอนนี้ ')+p.length+')');
  if(p.length>72)out.push(_tx('ยาวไม่เกิน 72 ตัว'));
  if(p&&!/^[\x21-\x7E]*$/.test(p))out.push(_tx('ใช้ได้เฉพาะ A–Z a–z 0–9 และอักขระพิเศษ (ห้ามช่องว่าง/ภาษาไทย)'));
  return out;
}
function pwStrength(p){var k=0;if(/[a-z]/.test(p))k++;if(/[A-Z]/.test(p))k++;if(/\d/.test(p))k++;if(/[^A-Za-z0-9]/.test(p))k++;if(p.length>=12)k++;return k;}
function pwField(id,label,ac){
  return '<div><label for="'+id+'">'+label+'</label><div class="pwrow"><input id="'+id+'" type="password" maxlength="72" autocomplete="'+(ac||'new-password')+'" autocapitalize="none" spellcheck="false"><button type="button" class="iconbtn pweye" data-act="pw-eye" data-id="'+id+_tx('" aria-label="แสดงรหัสผ่าน">👁</button></div></div>');
}
function pwFormHtml(o){
  return (o.current?pwField('pwCur',_tx('รหัสผ่านปัจจุบัน'),'current-password'):'')+
    pwField('pwNew',o.newLabel||_tx('รหัสผ่านใหม่'))+
    _tx('<ul class="pwchk" id="pwChk" aria-live="polite"><li data-k="len">อย่างน้อย 8 ตัว</li><li data-k="chr">เฉพาะ A–Z a–z 0–9 และอักขระพิเศษ</li><li data-k="mat">ยืนยันรหัสตรงกัน</li></ul><div class="pwbar" aria-hidden="true"><i id="pwBar"></i></div>')+
    pwField('pwNew2',_tx('ยืนยันรหัสผ่านใหม่อีกครั้ง'))+
    '<p class="muted small">'+PW_RULE+'</p><div class="err" id="pwErr" role="alert"></div>';

function pwLive(){
  var a=$('pwNew'),b=$('pwNew2'),c=$('pwChk');if(!a||!c)return;
  var p=a.value,q=b?b.value:'';
  var st={len:p.length>=8&&p.length<=72,chr:p.length>0&&/^[\x21-\x7E]*$/.test(p),mat:p.length>0&&p===q};
  Array.prototype.forEach.call(c.children,function(li){li.className=st[li.dataset.k]?'on':'';});
  var bar=$('pwBar');if(bar){var s=p?pwStrength(p):0;bar.style.width=(s*20)+'%';bar.className='s'+s;}

function pwValues(needCur){
  var cur=needCur?$('pwCur').value:'',p=$('pwNew').value,q=$('pwNew2').value,errs=pwProblems(p);

  if(needCur&&cur&&p===cur)errs.push(_tx('รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม'));

async function submitPw(){
  if(busy||!pwm)return;
  var isReset=pwm.mode==='reset',v=pwValues(!isReset),er=$('pwErr'),btn=$('pwOk');
  if(v.errs.length){er.textContent=v.errs.join(' · ');return;}
  busy=true;btn.disabled=true;er.textContent='';
  try{
    if(isReset){
      var t=emp(pwm.id);
      await adminFn({action:'set_password',id:pwm.id,password:v.p});
      pwm=null;busy=false;renderPw();await loadAll();renderAll();
      toast(_tx('รีเซ็ตรหัสผ่านแล้ว'),(t?t.name+' ('+t.username+')':'')+_tx(' ต้องตั้งรหัสใหม่เมื่อล็อกอินครั้งถัดไป'));
    }else{
      await adminFn({action:'change_own',current:v.cur,password:v.p});
      await sb.auth.signInWithPassword({email:me.username+'@'+(CFG.USER_DOMAIN||'wifi-check.app'),password:v.p});
      pwm=null;busy=false;renderPw();toast(_tx('เปลี่ยนรหัสผ่านแล้ว'),_tx('ครั้งหน้าให้ใช้รหัสผ่านใหม่ในการล็อกอิน'));

}

async function submitForce(){

function simWho(d,s){var sl=slot(d,s);if(!sl)return null;return sl.off?sl.cover:sl.regular;}
function simDefaults(){
  var today=bkk(now()).date,W=simWorkers();
  if(!sim.date)sim.date=today;
  if(!sim.emp||!emp(sim.emp))sim.emp=W.length?W[0].id:'';
  var cur=sim.shift?shiftById(sim.shift):null;
  if(!cur){var mine=SHIFTS.find(function(s){var w=simWho(sim.date,s);return w&&w.id===sim.emp;});sim.shift=(mine||SHIFTS[0]).id;}
  var s=shiftById(sim.shift);
  if(!sim.tin)sim.tin=dtl(startTs(sim.date,s));
  if(!sim.tout)sim.tout=dtl(endTs(sim.date,s));
}
function simReset(keepTimes){sim.rin=null;sim.rout=null;if(!keepTimes){sim.tin='';sim.tout='';}}
/* กฎเดียวกับฟังก์ชัน check_in บนเซิร์ฟเวอร์ */
function simCheckIn(){
  var e=emp(sim.emp),s=shiftById(sim.shift),d=sim.date,t=dtlParse(sim.tin),S=ST();
  var r={kind:'in',when:t,emp:e,d:d,s:s};
  if(isNaN(t)){r.err=_tx('กรุณาเลือกวันและเวลาเข้างาน');return r;}
  var sl=slot(d,s);
  if(!sl&&s.flex&&teamDayIdx(s.team,d)>=0){r.err=_tx('คุณไม่ได้อยู่ในกะนี้');r.why=_tx('กะฉุกเฉิน 19.00–04.00 วันนี้ยังไม่มีการเรียกตัว (เรียกได้ที่หน้าตารางกะ)');return r;}
  if(!sl){r.err=_tx('ทีมนี้ไม่ทำงานวันดังกล่าว');r.why=TEAMS[s.team].name+_tx(' ไม่มีกะในวัน')+DOW_TH[dowOf(d)];return r;}
  var w=sl.off?sl.cover:sl.regular;
  if(!w||w.id!==e.id){r.err=_tx('คุณไม่ได้อยู่ในกะนี้');r.why=sl.off?(sl.cover?_tx('วันนี้ ')+sl.cover.name+_tx(' ทำแทน ')+fn(sl.regular):fn(sl.regular)+_tx(' หยุด และยังไม่มีผู้ทำแทน')):_tx('ผู้ประจำกะนี้คือ ')+(sl.regular?sl.regular.name:_tx('— (ยังไม่มีผู้ประจำ)'));return r;}
  var st=startTs(d,s),en=endTs(d,s),open=st-S.openBefore*60000;
  if(t<open){r.err=_tx('ยังไม่ถึงเวลาเปิดให้ลงเวลา');r.why=_tx('เปิดให้ลงเวลาตั้งแต่ ')+fmtHM(open)+_tx(' น. (ก่อนเริ่มกะ ')+S.openBefore+_tx(' นาที) · ยังเหลืออีก ')+durTxt(Math.ceil((open-t)/60000));return r;}
  if(t>en){r.err=_tx('กะนี้สิ้นสุดแล้ว');r.why=_tx('กะเลิก ')+fmtHM(en)+_tx(' น. ')+(bkk(en).date!==d?'('+sd(bkk(en).date)+')':'')+_tx(' เลยเวลามาแล้ว ')+durTxt(Math.floor((t-en)/60000));return r;}
  var openRec=state.attendance.find(function(a){return a.emp===e.id&&!a.out&&!(a.date===d&&a.shift===s.id)&&endTs(a.date,shiftById(a.shift))+12*3600000>t;});
  if(openRec){r.err=_tx('ยังมีกะที่ไม่ได้ออกงาน');r.why=_tx('ในระบบจริง ')+e.name+_tx(' ยังไม่ได้ออกงานกะ ')+shiftLabel(shiftById(openRec.shift))+_tx(' วันที่ ')+sd(openRec.date);return r;}
  if(state.attendance.some(function(a){return a.emp===e.id&&a.date===d&&a.shift===s.id;})){r.err=_tx('ลงเวลาเข้างานกะนี้ไปแล้ว');r.why=_tx('ในระบบจริงมีบันทึกเข้างานของกะนี้อยู่แล้ว');return r;}
  var late=Math.floor((t-st)/60000);
  r.ok=true;r.late=Math.max(0,late);r.off=late;r.flag=late>S.lateAfter;r.cover=!!sl.off;
  r.msg=_tx('เข้างานสำเร็จ เวลา ')+fmtHM(t)+_tx(' น. · ')+(r.flag?_tx('สาย ')+r.late+_tx(' นาที'):_tx('ตรงเวลา'));
  r.detail=late<0?_tx('เข้าก่อนเริ่มกะ ')+(-late)+_tx(' นาที'):late===0?_tx('เข้าตรงเวลาเริ่มกะพอดี'):late<=S.lateAfter?_tx('หลังเริ่มกะ ')+late+_tx(' นาที ยังอยู่ในเวลาผ่อนผัน ')+S.lateAfter+_tx(' นาที จึงนับว่าตรงเวลา'):_tx('หลังเริ่มกะ ')+late+_tx(' นาที เกินเวลาผ่อนผัน ')+S.lateAfter+_tx(' นาที จึงนับว่าสาย');
  r.notify=r.flag?e.name+_tx(' เข้างานสาย ')+r.late+_tx(' นาที (กะ ')+s.start.replace(':','.')+' · '+d.slice(8)+'/'+d.slice(5,7)+')':'';

/* ---------- ทีม A: หมุน 4 กะรายสัปดาห์ · ทีม B: รอบ 2 สัปดาห์ · กะฉุกเฉิน 19.00–04.00 ---------- */
var ROT=['A2','A3','A4','A1'],rotaEdit=false,rotaWeek=null,rotaBEdit=false,rotaBStart=null;
function rotaAt(S,d){
  var m=mondayOf(d),best=null;
  (S&&S.rota||[]).forEach(function(r){if(r.week<=m&&(!best||r.week>best.week))best=r;});
  return best&&best.active?best:null;
}
function rotaK(r,d){return Math.round((Date.parse(mondayOf(d))-Date.parse(r.week))/(7*864e5));}
function rotaBAt(S,d){
  var best=null;(S&&S.rotaB||[]).forEach(function(r){if(r.start<=d&&(!best||r.start>best.start))best=r;});
  return best&&best.active?best:null;
}
function rotaBOff(r,d){return Math.round((Date.parse(d)-Date.parse(r.start))/864e5);}
/* วันทำงานของทีม */
function teamWorksS(S,team,d){
  if(team==='A')return [1,2,3,4,5].indexOf(dowOf(d))>=0&&!(S&&S.holidays&&S.holidays[d]); // ทีม A หยุดวันหยุดราชการ/นักขัตฤกษ์
  if(team!=='B')return false;
  var r=rotaBAt(S,d);if(!r)return [5,6,0,1].indexOf(dowOf(d))>=0;
  return [0,1,2,3,7,8,9].indexOf(((rotaBOff(r,d)%14)+14)%14)>=0;
}
function teamDayIdx(team,d){return teamWorksS(state,team,d)?0:-1;}
function teamDayText(id){
  if(id==='B'&&rotaBAt(state,bkk(now()).date))return _tx('ศ.–จ. สลับ ศ.–อา. (รอบ 2 สัปดาห์)');
  return TEAMS[id]?TEAMS[id].dayText:'';
}
function isRotating(e){var t=bkk(now()).date,r=rotaAt(state,t),b=rotaBAt(state,t);return !!(e&&((r&&r.ids.indexOf(e.id)>=0)||(b&&(b.day===e.id||b.night===e.id))));}
/* กะที่คนนี้ทำในวันที่ d */
function shiftOnS(S,e,d){
  if(!e)return null;
  if(e.team==='B'||e.shift==='B1'||e.shift==='B2'){
    var b=rotaBAt(S,d);if(!b)return e.shift;
    var c=Math.floor(rotaBOff(b,d)/14)%2;
    if(e.id===b.day)return c===0?'B1':'B2';
    if(e.id===b.night)return c===0?'B2':'B1';
    return (e.shift==='B1'||e.shift==='B2')?null:e.shift;
  }
  var r=rotaAt(S,d);if(!r)return e.shift;
  var n=r.cyc,sh=ROT.slice(0,n),ids=r.ids.slice(0,n),i=ids.indexOf(e.id);
  if(i<0)return sh.indexOf(e.shift)>=0?null:e.shift;
  return sh[((i+rotaK(r,d))%n+n)%n];
}
/* ผู้ประจำกะ */
function regularOfS(S,d,s){
  if(s.flex)return null;
  var find=function(id){return S.employees.find(function(e){return e.id===id&&e.active&&e.role==='staff';})||null;};
  if(s.id==='B1'||s.id==='B2'){
    var b=rotaBAt(S,d);
    if(b){var c=Math.floor(rotaBOff(b,d)/14)%2;return find((s.id==='B1')===(c===0)?b.day:b.night);}
    return S.employees.find(function(e){return e.active&&e.role==='staff'&&e.shift===s.id;})||null;
  }
  var r=rotaAt(S,d);
  if(r){
    var n=r.cyc,ids=r.ids.slice(0,n),j=ROT.slice(0,n).indexOf(s.id);
    if(j>=0)return find(ids[((j-rotaK(r,d))%n+n)%n]);

function planDays(s,mode,other,from,to){
  var ok=[],skip=[];
  for(var dd=from;dd<=to;dd=addDays(dd,1)){
    var sl=slot(dd,s);if(!sl)continue;
    if(mode==='work'){if(state.overrides[dd+'|'+s.id])ok.push(dd);continue;}
    if(!sl.regular){skip.push([dd,_tx('ไม่มีผู้ประจำ')]);continue;}
    if(!other){ok.push(dd);continue;}
    if(other===sl.regular.id){skip.push([dd,_tx('เป็นผู้ประจำอยู่แล้ว')]);continue;}
    var oe=emp(other);
    if(mode==='cover'){
      var b=busyIn(other,startTs(dd,s),endTs(dd,s),dd+'|'+s.id,dd);
      if(b)skip.push([dd,_tx('ชนกะ ')+b]);else ok.push(dd);
    }else{
      var os=shiftOn(oe,dd),osh=os&&shiftById(os);
      if(!osh||os===s.id||!slot(dd,osh))skip.push([dd,_tx('ไม่มีกะของ ')+fn(oe)]);else ok.push(dd);
    }
  }
  return {ok:ok,skip:skip};
}

function forgotData(rows){

function noteDate(n){
  var m=/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/.exec(n.body||'');if(!m)return '';

function schedRange(){
  var today=bkk(now()).date,f=getDv('rgFrom',today),t=getDv('rgTo',addDays(today,13));

  var cut=false;if(Date.parse(t)-Date.parse(f)>61*864e5){t=addDays(f,61);cut=true;}
  var out=[];for(var d=f;d<=t;d=addDays(d,1))out.push(d);
  return {f:f,t:t,days:out,cut:cut};
}

async function saveSlot(){

  var d=editSlot.d,s=shiftById(editSlot.s),key=d+'|'+s.id,sl=slot(d,s),err=$('slotErr');
  var mode=document.querySelector('input[name=mode]:checked').value,prev=state.overrides[key];
  var when=dayShort(d)+_tx(' กะ ')+shiftLabel(s)+' ('+TEAMS[s.team].name+')';
  var cv=null,note='';
  if(mode==='off'){
    cv=$('covSel').value;note=$('covNote').value.trim();
    if(!cv){err.textContent=_tx('ระบุผู้ทำงานแทนก่อนบันทึก');return;}
  }
  busy=true;err.textContent='';
  try{
    await rpc('set_override',{p_date:d,p_shift:s.id,p_cover:cv,p_note:note});
    if(mode==='work'){
      if(prev){var pc=emp(prev.cover);notify([sl.regular.id,pc&&pc.id],'ยกเลิกการหยุด',sl.regular.name+' กลับมาทำงานตามปกติ '+when+(pc?' · '+pc.name+' ไม่ต้องทำแทนแล้ว':''));}
    }else{
      var c=emp(cv);
      if(prev&&prev.cover!==cv){var oc=emp(prev.cover);if(oc)notify([oc.id],'ยกเลิกการทำแทน','ไม่ต้องทำแทน '+sl.regular.name+' '+when+' แล้ว');}
      notify([sl.regular.id,cv],'เปลี่ยนตารางกะ',sl.regular.name+' หยุด '+when+' · '+c.name+' ทำแทน'+(note?' · '+note:''));
    }
    editSlot=null;await loadAll();busy=false;renderAll();
  }catch(e){busy=false;var er=$('slotErr');if(er)er.textContent=errMsg(e);}
}

/* จัดลำดับการ์ดพนักงาน (หน้าพนักงานเท่านั้น): ลากที่ขีดจับมุมขวาบน (เมาส์/นิ้ว) หรือกดลูกศรบนคีย์บอร์ด

function byOrder(list){
  return list.map(function(e,i){return [e,i];}).sort(function(a,b){
    var x=a[0].sortOrder==null?1e9:a[0].sortOrder,y=b[0].sortOrder==null?1e9:b[0].sortOrder;return x-y||a[1]-b[1];
  }).map(function(p){return p[0];});
}
async function saveOrder(ids){

  ids.forEach(function(id,i){var e=emp(id);if(e)e.sortOrder=i+1;});
  busy=true;
  try{var r=await sb.rpc('set_profile_order',{p_ids:ids});if(r.error)throw r.error;}
  catch(err){state.employees.forEach(function(e){e.sortOrder=old[e.id];});if(view==='people')renderView();toast(_tx('บันทึกลำดับไม่สำเร็จ'),errMsg(err),'warn');}
  finally{busy=false;}

function gridIds(g){return [].map.call(g.querySelectorAll('.pcard[data-eid]'),function(c){return c.getAttribute('data-eid');});}
var pdrag=null;
function startPdrag(h,x,y){
  var card=h.closest('.pcard'),grid=card&&card.parentNode;if(!grid)return false;
  var r=card.getBoundingClientRect(),ph=document.createElement('div');
  ph.className='pcard-ph';ph.style.height=r.height+'px';grid.insertBefore(ph,card);
  card.classList.add('dragging');card.style.width=r.width+'px';card.style.height=r.height+'px';card.style.left=r.left+'px';card.style.top=r.top+'px';
  document.body.classList.add('pdragging');
  pdrag={card:card,grid:grid,ph:ph,dx:x-r.left,dy:y-r.top,before:gridIds(grid).join()};
  return true;
}
function movePdrag(x,y){
  var d=pdrag,c=d.card;c.style.left=(x-d.dx)+'px';c.style.top=(y-d.dy)+'px';
  if(y<70)scrollBy(0,-14);else if(y>innerHeight-70)scrollBy(0,14);
  var t=document.elementsFromPoint(x,y).find(function(el){return el!==c&&el.classList&&el.classList.contains('pcard')&&el.parentNode===d.grid;});
  if(!t)return;
  var kids=[].slice.call(d.grid.children);
  d.grid.insertBefore(d.ph,kids.indexOf(d.ph)<kids.indexOf(t)?t.nextSibling:t);
}
function endPdrag(){
  if(!pdrag)return;var d=pdrag;pdrag=null;
  d.grid.insertBefore(d.card,d.ph);d.ph.remove();d.card.classList.remove('dragging');
  ['width','height','left','top'].forEach(function(k){d.card.style[k]='';});
  document.body.classList.remove('pdragging');
  var ids=gridIds(d.grid);if(ids.join()!==d.before)saveOrder(ids);

/* เมาส์/ปากกา: pointer events · นิ้ว: touch events (iPhone/แอปบนหน้าจอโฮมยกเลิก pointer กลางทางได้ จึงใช้ touch โดยตรง) */
document.addEventListener('pointerdown',function(e){

  var h=e.target.closest&&e.target.closest('[data-drag]');if(!h||busy||pdrag||e.button>0)return;

});

document.addEventListener('pointerup',function(e){if(e.pointerType!=='touch')endPdrag();});
document.addEventListener('pointercancel',function(e){if(e.pointerType!=='touch')endPdrag();});
document.addEventListener('touchstart',function(e){
  var h=e.target.closest&&e.target.closest('[data-drag]');if(!h||busy||pdrag||e.touches.length!==1)return;
  var t=e.touches[0];if(startPdrag(h,t.clientX,t.clientY))e.preventDefault();
},{passive:false});
document.addEventListener('touchmove',function(e){if(!pdrag)return;e.preventDefault();var t=e.touches[0];if(t)movePdrag(t.clientX,t.clientY);},{passive:false});

function buildCsv(from,to){
  var rows=[['date','day','team','shift_start','shift_end','regular_username','regular_name','status','cover_username','cover_name','note']];
  for(var d=from,n=0;d<=to&&n<62;d=addDays(d,1),n++){
    SHIFTS.forEach(function(s){
      var sl=slot(d,s);if(!sl)return;
      var o=sl.off?state.overrides[d+'|'+s.id]:null;
      rows.push([d,DOW_TH[dowOf(d)],TEAMS[s.team].name,s.start,s.end,sl.regular?sl.regular.username:'',sl.regular?sl.regular.name:'',sl.off?_tx('หยุด'):_tx('ทำงาน'),sl.off&&sl.cover?sl.cover.username:'',sl.off&&sl.cover?sl.cover.name:'',o?o.note:'']);
    });
  }
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim()!=='';}))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(function(x){return x.trim()!=='';}))rows.push(row);
  return rows;
}
function checkCsv(text){
  var rows=parseCsv(text);
  if(rows.length<2)return {error:_tx('ไม่พบข้อมูล ต้องมีหัวตารางและอย่างน้อย 1 แถว')};
  var h=rows[0].map(function(x){return x.trim().toLowerCase();});
  var ix={};['date','team','shift_start','status','cover_username','note'].forEach(function(k){ix[k]=h.indexOf(k);});
  var miss=['date','team','shift_start','status'].filter(function(k){return ix[k]<0;});
  if(miss.length)return {error:_tx('หัวตารางขาดคอลัมน์: ')+miss.join(', ')};
  var results=[];
  rows.slice(1).forEach(function(r,i){
    var get=function(k){return ix[k]>=0&&r[ix[k]]!=null?r[ix[k]].trim():'';};
    var res={line:i+2,date:get('date'),ok:false,msg:'',text:''};
    var tm=/ทีม\s*([ab])|^([ab])$/i.exec(get('team')),tid=tm?(tm[1]||tm[2]).toUpperCase():'';
    var st=get('shift_start'),sm=/^(\d{1,2}):(\d{2})$/.exec(st),stn=sm?('0'+sm[1]).slice(-2)+':'+sm[2]:'';
    var s=SHIFTS.find(function(x){return x.team===tid&&x.start===stn;});
    var status=get('status').toLowerCase(),off=(status==='หยุด'||status==='off'),work=(status==='ทำงาน'||status==='work');

async function applyCsv(){
  if(!io.preview||!io.preview.results||busy)return;
  busy=true;var changed=0,failed=0;
  try{
    var list=io.preview.results.filter(function(r){return r.ok;});
    for(var i=0;i<list.length;i++){
      var r=list[i],a=r.action,parts=a.key.split('|'),d=parts[0],s=shiftById(parts[1]),sl=slot(d,s),prev=state.overrides[a.key];
      var when=dayShort(d)+_tx(' กะ ')+shiftLabel(s)+' ('+TEAMS[s.team].name+')';
      try{
        if(!a.off){
          if(prev){await rpc('set_override',{p_date:d,p_shift:s.id,p_cover:null,p_note:''});var pc=emp(prev.cover);changed++;notify([sl.regular.id,pc&&pc.id],'ยกเลิกการหยุด',sl.regular.name+' กลับมาทำงานตามปกติ '+when);}
        }else if(!prev||prev.cover!==a.cover||(prev.note||'')!==(a.note||'')){
          await rpc('set_override',{p_date:d,p_shift:s.id,p_cover:a.cover,p_note:a.note||''});changed++;
          var c=emp(a.cover);
          if(prev&&prev.cover!==a.cover)notify([prev.cover],'ยกเลิกการทำแทน','ไม่ต้องทำแทน '+sl.regular.name+' '+when+' แล้ว');
          notify([sl.regular.id,a.cover],'เปลี่ยนตารางกะ',sl.regular.name+' หยุด '+when+' · '+c.name+' ทำแทน'+(a.note?' · '+a.note:''));
        }
      }catch(e){failed++;}
    }
    var skipped=io.preview.results.filter(function(r){return !r.ok;}).length;
    notify([me.id],'นำเข้าตารางกะ','นำเข้าแล้ว: เปลี่ยนแปลง '+changed+' รายการ · ข้ามแถวที่ไม่ถูกต้อง '+skipped+' แถว'+(failed?' · ผิดพลาด '+failed+' แถว':''));
    io.msg=_tx('นำเข้าสำเร็จ เปลี่ยนแปลง ')+changed+_tx(' รายการ ข้าม ')+skipped+_tx(' แถว')+(failed?_tx(' ผิดพลาด ')+failed+_tx(' แถว'):'');io.preview=null;
    await loadAll();
  }catch(e){io.msg=_tx('นำเข้าไม่สำเร็จ: ')+errMsg(e);}
  busy=false;renderAll();
}
