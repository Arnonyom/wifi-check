function toast(title,body,kind,nid){
  var box=$('toast');if(!box)return;
  var tn=nid!=null&&state.notifications.find(function(x){return x.id===nid;}),tg=tn&&noteTarget(tn);
  var el=document.createElement(tg?'button':'div');el.className='toast'+(kind==='warn'?' warn':'')+(tg?' tgo':'');

  var b=document.createElement('b');b.textContent=title;var s=document.createElement('span');s.textContent=body||'';

function showTip(el,x,y){
  var tip=$('tip');if(!tip)return;
  var lines=el.getAttribute('data-tip').split('\n');
  tip.textContent='';
  var tt=document.createElement('div');tt.className='tt';tt.textContent=lines[0];tip.appendChild(tt);
  lines.slice(1).forEach(function(ln){
    var p=ln.split('|'),r=document.createElement('div');r.className='tr';
    if(p[2]){var i=document.createElement('i');i.style.background=p[2];r.appendChild(i);}
    var v=document.createElement('b');v.textContent=p[1]||'';var n=document.createElement('span');n.className='muted';n.textContent=p[0];
    r.appendChild(v);r.appendChild(n);tip.appendChild(r);
  });
  tip.hidden=false;
  var w=tip.offsetWidth,h=tip.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  var px=x+14,py=y+14;if(px+w>vw-8)px=Math.max(8,x-w-14);if(py+h>vh-8)py=Math.max(8,y-h-14);

}

    case 'dp':dp={id:D.id,month:(getDv(D.id,bkk(now()).date)||bkk(now()).date).slice(0,7),sel:getDv(D.id,bkk(now()).date)};renderDp();break;
    case 'dp-m':dp.month=addMonth(dp.month,Number(D.n));renderDp();break;
    case 'dp-today':var id0=dp.id;dp=null;renderDp();onDate(id0,bkk(now()).date);break;
    case 'dp-pick':var id1=dp.id;dp=null;renderDp();onDate(id1,D.d);break;
    case 'dp-close':dp=null;renderDp();break;
    case 'dp-bg':if(e.target===el){dp=null;renderDp();}break;
  }
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='lvReason')lv.reason=t.value;else if(t.id==='lvNote')lvNote=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='mode'){$('covRow').hidden=t.value!=='off';}
  else if(t.id==='fTeam'){
    $('fShift').innerHTML=shiftOptions(t.value,'');
    $('fShiftRow').hidden=t.value==='OPS';$('fOpsHint').hidden=t.value!=='OPS';
  }else if(t.id==='fRole'){
    var adm=t.value==='admin';
    $('fTeamRow').hidden=adm;$('fWorkRow').hidden=!adm;
    $('fShiftRow').hidden=adm||$('fTeam').value==='OPS';$('fOpsHint').hidden=adm||$('fTeam').value!=='OPS';
  }else if(t.id==='simTm'){
    if(t.value){clockOffset=Date.parse((dv.simD||bkk(now()).date)+'T'+t.value+':00+07:00')-Date.now();renderAll();}
  }else if(t.id==='rpTeam'||t.id==='rpEmp'){
    rep.team=$('rpTeam').value;rep.emp=$('rpEmp').value;rep.csv='';renderView();
  }else if(t.id==='csvFile'&&t.files&&t.files[0]){
    var fr=new FileReader(),fl=t.files[0],isX=/\.xlsx$/i.test(fl.name);
    fr.onload=function(){
      if(!isX){io.csv=String(fr.result||'');io.msg='';io.preview=checkCsv(io.csv);renderView();return;}
      XL.read(fr.result).then(function(rows){io.csv=rowsToCsv(rows);io.msg='';io.preview=checkCsv(io.csv);renderView();}).catch(function(err){io.preview=null;io.msg=err.message||'อ่านไฟล์ Excel ไม่ได้';renderView();});
    };
    if(isX)fr.readAsArrayBuffer(fl);else fr.readAsText(fl,'utf-8');
  }
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act="det"]:not(button)')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
  if(e.key!=='Escape')return;
  if(dp){dp=null;renderDp();}
  else if(pwm){pwm=null;renderPw();}
  else if(det.length){closeDet(false);}
  else if(modal){closeModal();}
  else if(bellOpen){bellOpen=false;renderChrome();}
});

/* ปัดหน้าต่างด้านล่างลงเพื่อปิด (มือถือ) */
(function(){
  var drag=null,CLOSE='[data-act=modal-cancel],[data-act=det-close],[data-act=pw-close],[data-act=dp-close]';
  function scrolledInside(el,m){for(var x=el;x&&x!==m.parentNode;x=x.parentNode){if(x.scrollTop>0)return true;if(x===m)break;}return false;}
  document.addEventListener('touchstart',function(e){
    drag=null;
    if(innerWidth>720||e.touches.length!==1)return;
    var m=e.target.closest&&e.target.closest('.overlay .modal');if(!m)return;
    if(e.target.closest('input,select,textarea')||scrolledInside(e.target,m))return;
    drag={m:m,y:e.touches[0].clientY,x:e.touches[0].clientX,dy:0,t:Date.now(),on:false};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!drag)return;
    var dy=e.touches[0].clientY-drag.y,dx=e.touches[0].clientX-drag.x;
    if(!drag.on){
      if(dy>8&&dy>Math.abs(dx)*1.2){drag.on=true;drag.m.style.transition='none';}
      else if(Math.abs(dy)>8||Math.abs(dx)>8){drag=null;return;}
      else return;
    }
    drag.dy=Math.max(0,dy);drag.m.style.transform='translateY('+drag.dy+'px)';
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  function end(){
    var d=drag;drag=null;if(!d||!d.on)return;
    var fast=d.dy/Math.max(1,Date.now()-d.t)>0.6;
    d.m.style.transition='transform .18s ease-out';
    var ov=d.m.closest('.overlay'),btn=ov&&ov.querySelector(CLOSE);
    if(btn&&!btn.disabled&&(d.dy>110||(fast&&d.dy>40))){
      d.m.style.transform='translateY(110%)';setTimeout(function(){btn.click();},160);return;
    }
    d.m.style.transform='';
  }
  document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
})();
